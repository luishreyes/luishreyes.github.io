<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Verificación de Google Search Console (propiedad https://portfolio.luishreyes.com/). No borrar: Google la revisa de vez en cuando. -->
    <meta name="google-site-verification" content="kfXLi7OnP7dR2lNmEWR-r48mKBJy_ZFe6PpQlowW5WM" />
    <title>Luis H. Reyes · Chemical and Food Engineering · Universidad de los Andes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/images/site/retrato-luis-h-reyes-2026.jpg" />
    <!-- El build (scripts/prerender.mjs) mete en #root la página ya armada, para los buscadores
         y para quien no tiene JavaScript. Con JavaScript no se muestra: React la reemplaza al
         arrancar, y así el sitio se ve igual que siempre. -->
    <style>[data-previo]{display:none}</style>
    <noscript><style>[data-previo]{display:block}</style></noscript>
    <script>
      // GitHub Pages SPA redirect restoration
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
        // Quien llega con barra final (/classroom/, como quedaron enlaces viejos) sigue en la
        // dirección sin barra, que es la que usa la app.
        if (l.pathname.length > 1 && l.pathname.slice(-1) === '/') {
          window.history.replaceState(null, null,
            l.pathname.replace(/\/+$/, '') + l.search + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-zinc-50 text-brand-dark antialiased">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
