/* ===== Tokens del design-system Narrativas Visuales (_ds) ===== */
:root{

  --carbon-1000:#0A0A0A;--carbon-950:#101010;--carbon-900:#141412;--carbon-850:#1A1A17;--carbon-800:#201F1B;--carbon-700:#2A2924;--carbon-600:#3A382F;
  --bone-100:#F2F0EB;--bone-000:#E8E6E1;--bone-300:#B8B6AE;--bone-500:#86847C;--bone-700:#56554F;
  --citron-000:#C9C41C;--citron-100:#DCD733;--citron-200:#EBE65A;--citron-700:#9A961A;--citron-900:#4A480F;
  --clay-000:#C8623A;--clay-900:#3A1F13;
  --line-soft:rgba(232,230,225,0.10);--line:rgba(232,230,225,0.16);--line-strong:rgba(232,230,225,0.30);--line-citron:rgba(201,196,28,0.55);
  --bg:var(--carbon-1000);--bg-raised:var(--carbon-900);--surface:var(--carbon-900);--surface-2:var(--carbon-850);--surface-hover:var(--carbon-800);
  --text:var(--bone-000);--text-muted:var(--bone-300);--text-faint:var(--bone-500);--text-disabled:var(--bone-700);--text-on-accent:var(--carbon-1000);

<body>
<div id="nv-app" style="display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--bg)"></div>

<script>
/* chartSvg.js — motor de gráficos SVG para Narrativas Visuales.
   window.buildChartSVG(id, {focus}) -> string SVG.
   Paleta: gris = contexto, citrón = foco (lo que importa), arcilla = negativo. */
(function () {
  const G = "#86847C";        // contexto
  const GD = "#56554F";       // contexto tenue
  const F = "#C9C41C";        // foco (citrón)
  const CL = "#C8623A";       // señal negativa (arcilla)
  const B = "#E8E6E1";        // hueso / texto
  const TX = "#86847C";       // texto tenue
  const GRID = "rgba(232,230,225,0.09)";
  const AX = "rgba(232,230,225,0.28)";
  const W = 340, H = 210;
  const PX0 = 38, PX1 = 326, PY0 = 16, PY1 = 180;

  const r = (x, y, w, h, fill, o = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" ${o}/>`;
  const ln = (x1, y1, x2, y2, s = AX, w = 1, o = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" ${o}/>`;
  const c = (cx, cy, rad, fill, o = "") => `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="${fill}" ${o}/>`;
  const p = (d, s, fill = "none", w = 1.5, o = "") => `<path d="${d}" stroke="${s}" fill="${fill}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${o}/>`;
  const t = (x, y, s, { fill = TX, size = 9, anchor = "middle", weight = 400, ff = "Archivo,sans-serif", ls = "0" } = {}) =>
    `<text x="${x}" y="${y}" fill="${fill}" font-size="${size}" text-anchor="${anchor}" font-weight="${weight}" font-family="${ff}" letter-spacing="${ls}">${s}</text>`;
  const axes = () => ln(PX0, PY0, PX0, PY1, AX) + ln(PX0, PY1, PX1, PY1, AX);
  const gy = (n = 4) => { let s = ""; for (let i = 1; i <= n; i++) { const y = PY1 - (PY1 - PY0) * i / n; s += ln(PX0, y, PX1, y, GRID); } return s; };
  const poly = (pts, s, fill = "none", w = 1.5) => p("M" + pts.map(a => a[0].toFixed(1) + " " + a[1].toFixed(1)).join(" L "), s, fill, w);
  // trazo suavizado (Catmull-Rom -> Bézier). closed=true cierra la figura.
  function smoothD(pts, closed = false) {
    if (pts.length < 3) return "M" + pts.map(a => a[0].toFixed(1) + " " + a[1].toFixed(1)).join(" L ");
    const P = closed ? [pts[pts.length - 1], ...pts, pts[0], pts[1]] : pts;
    let d = "M" + P[closed ? 1 : 0][0].toFixed(1) + " " + P[closed ? 1 : 0][1].toFixed(1);
    const start = closed ? 1 : 0, end = closed ? P.length - 2 : P.length - 1;
    for (let i = start; i < end; i++) {
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += `C${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d + (closed ? "Z" : "");
  }
  const spline = (pts, s, fill = "none", w = 1.5, closed = false) => p(smoothD(pts, closed), s, fill, w);
  const map = (arr, lo, hi, a, b) => arr.map(v => a + (b - a) * (v - lo) / (hi - lo));
  const xlab = (s) => t((PX0 + PX1) / 2, H - 3, s, { size: 8.5, ls: "0.05em" });
  const ylab = (s) => `<text x="11" y="${(PY0 + PY1) / 2}" fill="${TX}" font-size="8.5" text-anchor="middle" font-family="Archivo,sans-serif" transform="rotate(-90 11 ${(PY0 + PY1) / 2})">${s}</text>`;

  // barras verticales genéricas
  function vbars(vals, focusIdx, opts = {}) {
    const max = Math.max(...vals) * 1.12;
    const n = vals.length, gap = 8, bw = (PX1 - PX0 - gap * (n + 1)) / n;
    let s = gy() + axes();
    vals.forEach((v, i) => {
      const x = PX0 + gap + i * (bw + gap);
      const h = (v / max) * (PY1 - PY0);
      const col = (opts.neg && opts.neg.includes(i)) ? CL : (i === focusIdx ? F : G);
      s += r(x, PY1 - h, bw, h, col);
    });
    return s;
  }

  const B_ = {}; // builders

  /* ---------- 01 COMPARAR ---------- */
  B_.barras = () => vbars([62, 71, 58, 88, 66, 74], 3) + ylab("Rendimiento %") + xlab("Lote");
  B_["barras-agrupadas"] = () => {
    const grp = [[70, 52, 38], [64, 44, 30], [58, 40, 26], [50, 33, 20]];
    const cols = [G, GD, F]; const max = 80, gw = (PX1 - PX0) / grp.length;
    let s = gy() + axes();
    grp.forEach((g, i) => { const bx = PX0 + i * gw + 8, bw = (gw - 20) / 3; g.forEach((v, j) => { const h = v / max * (PY1 - PY0); s += r(bx + j * bw, PY1 - h, bw - 1.5, h, cols[j]); }); });
    return s + ylab("Humedad %") + xlab("Tiempo de secado");
  };
  B_["barras-apiladas"] = () => {
    const data = [[30, 22, 34, 8], [26, 30, 30, 10], [34, 18, 38, 6], [28, 26, 32, 9], [30, 24, 33, 8]];
    const cols = [GD, G, F, "#3A382F"]; const gap = 12, bw = (PX1 - PX0 - gap * 6) / 5;
    let s = axes();
    data.forEach((st, i) => { const x = PX0 + gap + i * (bw + gap); let acc = 0; const tot = st.reduce((a, b) => a + b, 0); st.forEach((v, j) => { const h = v / (tot * 1.05) * (PY1 - PY0); s += r(x, PY1 - acc - h, bw, h, cols[j]); acc += h; }); });
    return s + ylab("g/100g") + xlab("Producto");
  };
  B_["barras-100"] = () => {
    const data = [[45, 30, 25], [38, 40, 22], [55, 20, 25], [30, 35, 35], [48, 28, 24]];
    const cols = [G, F, GD]; const gap = 12, bw = (PX1 - PX0 - gap * 6) / 5;
    let s = axes();
    data.forEach((st, i) => { const x = PX0 + gap + i * (bw + gap); let acc = 0; st.forEach((v, j) => { const h = v / 100 * (PY1 - PY0); s += r(x, PY1 - acc - h, bw, h, cols[j]); acc += h; }); });
    return s + ylab("% defectos") + xlab("Línea");
  };
  B_.dotplot = () => {
    const before = [30, 42, 55, 38, 62, 48, 70, 35], after = [45, 58, 60, 52, 78, 66, 82, 50];
    const n = before.length, step = (PY1 - PY0) / n;
    let s = ln(PX0, PY0, PX0, PY1, AX) + ln(PX0, PY1, PX1, PY1, AX);
    for (let i = 0; i < n; i++) { const y = PY0 + step * (i + 0.5); const xa = PX0 + before[i] / 100 * (PX1 - PX0), xb = PX0 + after[i] / 100 * (PX1 - PX0); s += ln(xa, y, xb, y, GD, 1.5) + c(xa, y, 3, G) + c(xb, y, 3.4, i === 6 ? F : B); }
    return s + xlab("Métrica  ·  ● antes  ● después");
  };
  B_.lollipop = () => {
    const vals = [82, 64, 55, 47, 40, 33, 25, 18], n = vals.length, step = (PY1 - PY0) / n;
    let s = ln(PX0, PY0, PX0, PY1, AX);
    vals.forEach((v, i) => { const y = PY0 + step * (i + 0.5), x = PX0 + v / 100 * (PX1 - PX0); s += ln(PX0, y, x, y, GD, 1.2) + c(x, y, 3.6, i === 0 ? F : G); });
    return s + xlab("Merma por operación");
  };
  B_.diverging = () => {
    const vals = [-40, -22, -8, 5, 30, 55, 20], n = vals.length; const mid = (PX0 + PX1) / 2, half = (PX1 - PX0) / 2 / 60;
    const gap = 6, bh = (PY1 - PY0 - gap * (n + 1)) / n;
    let s = ln(mid, PY0, mid, PY1, AX);
    vals.forEach((v, i) => { const y = PY0 + gap + i * (bh + gap); const w = Math.abs(v) * half; const x = v < 0 ? mid - w : mid; s += r(x, y, w, bh, v < 0 ? CL : (i === 5 ? F : G)); });
    return s + xlab("← desagrada    agrada →");
  };
  B_.bullet = () => {
    const rows = [[70, 82, [50, 70, 95]], [62, 60, [45, 65, 90]]];
    let s = "";
    rows.forEach((row, i) => {
      const y = 60 + i * 70, h = 26; const sc = x => PX0 + x / 100 * (PX1 - PX0);
      const shades = ["#201F1B", "#2A2924", "#3A382F"]; let prev = 0;
      row[2].forEach((band, j) => { s += r(sc(prev), y, sc(band) - sc(prev), h, shades[j]); prev = band; });
      s += r(PX0, y + h / 2 - 4, sc(row[0]) - PX0, 8, i === 0 ? F : G);
      s += ln(sc(row[1]), y - 3, sc(row[1]), y + h + 3, B, 2);
    });
    return axes() + s + xlab("Real ▮  ·  meta │  ·  rangos");
  };
  B_.radar = () => {
    const cx = (PX0 + PX1) / 2, cy = 100, R = 78, ax = 6;
    const sets = [[.9, .6, .75, .5, .8, .55], [.5, .8, .4, .7, .45, .6]];
    const cols = [F, G]; let s = "";
    for (let ring = 1; ring <= 3; ring++) { let pts = []; for (let i = 0; i < ax; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / ax; pts.push([cx + Math.cos(a) * R * ring / 3, cy + Math.sin(a) * R * ring / 3]); } s += poly([...pts, pts[0]], GRID, "none", 1); }
    for (let i = 0; i < ax; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / ax; s += ln(cx, cy, cx + Math.cos(a) * R, cy + Math.sin(a) * R, GRID); }
    sets.forEach((set, k) => { let pts = set.map((v, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / ax; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; }); s += poly([...pts, pts[0]], cols[k], k === 0 ? "rgba(201,196,28,0.12)" : "none", 1.8); });
    return s + t(cx, 200, "Perfil sensorial (6 atributos)", { size: 8.5 });
  };

  /* ---------- 02 DISTRIBUCIÓN ---------- */
  B_.histograma = () => {
    const bins = [4, 9, 18, 30, 42, 48, 40, 28, 16, 7, 3], max = 55, bw = (PX1 - PX0) / bins.length;
    let s = gy() + axes();
    bins.forEach((v, i) => { const h = v / max * (PY1 - PY0); s += r(PX0 + i * bw + 1, PY1 - h, bw - 2, h, i === 5 ? F : G); });
    return s + ylab("Frecuencia") + xlab("Peso neto (g)");
  };
  B_.densidad = () => {
    const curve = (mu, sd, sc) => { let pts = []; for (let x = PX0; x <= PX1; x += 4) { const z = (x - mu) / sd; pts.push([x, PY1 - Math.exp(-0.5 * z * z) * sc]); } return pts; };
    let s = axes();
    s += spline(curve(140, 42, 150), G, "none", 2);
    s += spline(curve(210, 30, 150), F, "rgba(201,196,28,0.12)", 2);
    return s + ylab("Densidad") + xlab("Tamaño de partícula (µm)");
  };
  B_.boxplot = () => {
    const box = (x, q, focus) => { const sc = v => PY1 - v / 100 * (PY1 - PY0); const col = focus ? F : G; let s = ln(x, sc(q[0]), x, sc(q[4]), col, 1.2); s += r(x - 12, sc(q[3]), 24, sc(q[1]) - sc(q[3]), "none", `stroke="${col}" stroke-width="1.4"`); s += ln(x - 12, sc(q[2]), x + 12, sc(q[2]), col, 2); s += ln(x - 7, sc(q[0]), x + 7, sc(q[0]), col, 1.2) + ln(x - 7, sc(q[4]), x + 7, sc(q[4]), col, 1.2); return s; };
    let s = gy() + axes();
    [[70, [40, 52, 58, 66, 78]], [140, [35, 48, 55, 62, 74]], [210, [30, 42, 50, 60, 72]], [280, [18, 32, 42, 55, 70]]].forEach((b, i) => s += box(b[0], b[1], i === 3));
    return s + ylab("Firmeza (N)") + xlab("Tiempo de almacenamiento");
  };
  B_.violin = () => {
    const vio = (cx, shape, focus) => { const col = focus ? F : G; let L = [], Rr = []; shape.forEach((w, i) => { const y = PY0 + 6 + i / (shape.length - 1) * (PY1 - PY0 - 12); L.push([cx - w, y]); Rr.push([cx + w, y]); }); return spline([...L, ...Rr.reverse()], col, focus ? "rgba(201,196,28,0.12)" : "rgba(134,132,124,0.10)", 1.4, true); };
    let s = axes();
    s += vio(90, [2, 10, 22, 14, 8, 16, 24, 12, 3], false);
    s += vio(210, [2, 8, 14, 20, 10, 6, 4, 2, 1], true);
    return s + xlab("Tiempo de residencia — bimodal a la izq.");
  };
  B_.beeswarm = () => {
    const groups = [[75, [55, 58, 52, 60, 57]], [160, [62, 68, 64, 71, 66, 69]], [250, [40, 45, 43, 48]]];
    let s = axes(); groups.forEach((g, gi) => { g[1].forEach((v, i) => { const y = PY1 - v / 90 * (PY1 - PY0); const off = (i % 2 ? 1 : -1) * (4 + (i % 3) * 3); s += c(g[0] + off, y, 3, gi === 1 ? F : G); }); });
    return s + xlab("Réplicas del piloto (n pequeño)");
  };
  B_.raincloud = () => {
    let s = axes(); const cx = shape => shape;
    const half = (y0, shape, focus) => { let pts = [[PX0, y0]]; shape.forEach((w, i) => { const x = PX0 + i / (shape.length - 1) * (PX1 - PX0); pts.push([x, y0 - w]); }); pts.push([PX1, y0]); return spline(pts, focus ? F : G, focus ? "rgba(201,196,28,0.12)" : "rgba(134,132,124,0.10)", 1.4); };
    s += half(70, [2, 12, 26, 34, 30, 20, 10, 4], true);
    // box + puntos debajo
    s += r(140, 92, 90, 12, "none", `stroke="${F}" stroke-width="1.3"`) + ln(175, 92, 175, 104, F, 1.6) + ln(120, 98, 250, 98, GD, 1);
    for (let i = 0; i < 24; i++) { const x = PX0 + 20 + Math.random() * (PX1 - PX0 - 40); s += c(x, 120 + (i % 3) * 6, 2, G); }
    return s + xlab("Nube + resumen + datos crudos");

    let dome = []; for (let a = 0; a <= Math.PI; a += 0.2) dome.push(sc(0.5 + 0.4 * Math.cos(a), 0.35 + 0.3 * Math.sin(a))); s += poly(dome, G, "none", 1.5);
    // isobars
    [0.6, 0.8].forEach(b => { let pts = []; for (let x = 0.1; x <= 0.95; x += 0.05) pts.push(sc(x, b * (0.4 + x * 0.5))); s += poly(pts, GD, "none", 1); });
    // proceso
    s += poly([sc(0.3, 0.75), sc(0.55, 0.45)], F, "none", 1.8) + c(...sc(0.3, 0.75), 3, F) + c(...sc(0.55, 0.45), 3, F);
    return s + ylab("Entalpía") + xlab("Entropía");
  };
  B_["curva-bomba"] = () => {
    let s = gy() + axes(); const sc = (x, y) => [PX0 + x * (PX1 - PX0), PY1 - y * (PY1 - PY0)];
    let pump = []; for (let x = 0; x <= 1.001; x += 0.05) pump.push(sc(x, 0.9 - 0.7 * x * x)); s += poly(pump, G, "none", 1.8);
    let sys = []; for (let x = 0; x <= 1.001; x += 0.05) sys.push(sc(x, 0.2 + 0.6 * x * x)); s += poly(sys, GD, "none", 1.6);
    s += c(...sc(0.62, 0.9 - 0.7 * 0.62 * 0.62), 4.5, F) + t(...sc(0.62, 0.9 - 0.7 * 0.62 * 0.62).map((v, i) => i === 0 ? v + 8 : v - 6), "punto op.", { fill: F, anchor: "start", size: 8 });
    return s + ylab("Cabeza (H)") + xlab("Caudal (Q)");
  };
  B_.rtd = () => {
    let s = gy() + axes(); const sc = (x, y) => [PX0 + x * (PX1 - PX0), PY1 - y * (PY1 - PY0)];
    let pts = []; for (let x = 0; x <= 1.001; x += 0.025) { const y = 4 * x * Math.exp(-3.2 * x); pts.push(sc(x, y)); }
    s += poly(pts, F, "rgba(201,196,28,0.10)", 2);
    return s + ylab("E(t)") + xlab("Tiempo adimensional θ");
  };
  B_.arrhenius = () => {
    let s = gy() + axes(); const pts = [[.1, .85], [.25, .72], [.4, .6], [.55, .46], [.7, .34], [.85, .2]];
    let P = pts.map(pt => [PX0 + pt[0] * (PX1 - PX0), PY1 - pt[1] * (PY1 - PY0)]);
    s += poly([P[0], P[5]], F, "none", 1.8); P.forEach(pt => s += c(pt[0], pt[1], 3, G));
    return s + t(PX1 - 8, PY0 + 20, "pendiente = −Ea/R", { fill: F, anchor: "end", size: 8 }) + ylab("ln k") + xlab("1 / T");
  };
  B_.psd = () => {
    const bins = [3, 8, 18, 32, 40, 30, 18, 9, 4], max = 46, bw = (PX1 - PX0) / bins.length; let s = gy() + axes(); let cum = 0, cumPts = []; const tot = bins.reduce((a, b) => a + b, 0);
    bins.forEach((v, i) => { const h = v / max * (PY1 - PY0); s += r(PX0 + i * bw + 1, PY1 - h, bw - 2, h, G); cum += v; cumPts.push([PX0 + i * bw + bw / 2, PY1 - cum / tot * (PY1 - PY0)]); });
    s += poly(cumPts, F, "none", 1.8);
    return s + ylab("Frecuencia / acum.") + xlab("Tamaño (log µm)");
  };
  B_["muerte-termica"] = () => {
    let s = gy() + axes(); const sc = (x, y) => [PX0 + x * (PX1 - PX0), PY1 - y * (PY1 - PY0)];
    [[0.9, 3.4], [0.75, 2.6], [0.6, 1.8]].forEach((ln0, i) => { s += poly([sc(0.1, ln0[0]), sc(0.9, ln0[0] - ln0[1] * 0.22)].map(pt => [pt[0], Math.min(PY1, pt[1] + 40)]), i === 0 ? F : G, "none", i === 0 ? 1.8 : 1.2); });
    return s + ylab("log (sobrevivientes)") + xlab("Tiempo — valores D y z");
  };
  B_.isotermas = () => {
    let s = gy() + axes(); const sc = (x, y) => [PX0 + x * (PX1 - PX0), PY1 - y * (PY1 - PY0)];
    let pts = []; for (let x = 0; x <= 1.001; x += 0.05) { const y = 0.15 + 0.5 * x + 0.5 * Math.pow(x, 6); pts.push(sc(x, Math.min(0.95, y))); }
    s += poly(pts, F, "none", 2);
    const rnd = scatterPts(23); pts.filter((_, i) => i % 3 === 0).forEach((pt, i) => s += c(pt[0] + (rnd[i] - .5) * 4, pt[1] + (rnd[i + 5] - .5) * 6, 2.4, G));
    return s + ylab("Humedad eq.") + xlab("Actividad de agua (aw)");
  };
  B_.secado = () => {
    let s = gy() + axes(); const sc = (x, y) => [PX0 + x * (PX1 - PX0), PY1 - y * (PY1 - PY0)];
    let moist = []; for (let x = 0; x <= 1.001; x += 0.05) moist.push(sc(x, 0.9 * Math.exp(-2.5 * x) + 0.05)); s += poly(moist, G, "none", 1.8);
    let rate = []; for (let x = 0; x <= 1.001; x += 0.05) { const y = x < 0.25 ? 0.7 : 0.7 * Math.exp(-3 * (x - 0.25)); rate.push(sc(x, y)); } s += poly(rate, F, "none", 1.8);
    return s + t(PX1 - 6, PY0 + 14, "velocidad", { fill: F, anchor: "end", size: 8 }) + ylab("Humedad / vel.") + xlab("Tiempo");
  };
  B_.reograma = () => {
    let s = gy() + axes(); const sc = (x, y) => [PX0 + x * (PX1 - PX0), PY1 - y * (PY1 - PY0)];
    let newt = []; for (let x = 0; x <= 1.001; x += 0.05) newt.push(sc(x, 0.85 * x)); s += poly(newt, GD, "none", 1.3);
    let shear = []; for (let x = 0; x <= 1.001; x += 0.05) shear.push(sc(x, 0.2 + 0.7 * Math.pow(x, 0.5))); s += poly(shear, F, "none", 2);
    const rnd = scatterPts(29); shear.filter((_, i) => i % 3 === 0).forEach((pt, i) => s += c(pt[0], pt[1] + (rnd[i] - .5) * 5, 2.4, G));
    return s + ylab("Esfuerzo τ") + xlab("Velocidad de corte γ̇");
  };
  B_["barrido-frecuencia"] = () => {
    let s = gy() + axes(); const sc = (x, y) => [PX0 + x * (PX1 - PX0), PY1 - y * (PY1 - PY0)];
    let gp = [], gpp = []; for (let x = 0; x <= 1.001; x += 0.05) { gp.push(sc(x, 0.55 + 0.15 * x)); gpp.push(sc(x, 0.28 + 0.05 * x)); }
    s += poly(gp, F, "none", 2) + poly(gpp, G, "none", 1.6);

  B_.tpa = () => {

    for (let x = 0; x <= 1.001; x += 0.02) { const y = peak(x, 0.25, 0.09, 0.85) + peak(x, 0.65, 0.09, 0.55); pts.push(sc(x, y)); }

  };

    let s = gy() + axes(); const sc = (x, y) => [PX0 + x * (PX1 - PX0), PY1 - y * (PY1 - PY0)];
    let pts = []; for (let x = 0; x <= 1.001; x += 0.02) { let y = 0.5; y -= 0.25 * Math.exp(-Math.pow((x - 0.6) / 0.05, 2)); y += 0.1 * (Math.tanh((x - 0.3) * 20)); pts.push(sc(x, y)); }
    s += poly(pts, F, "none", 2);
    return s + t(sc(0.6, 0.25)[0], sc(0.6, 0.25)[1] + 12, "fusión", { fill: TX, size: 8 }) + ylab("Flujo de calor") + xlab("Temperatura");

  B_.cielab = () => {

  B_.espectros = () => {
    let s = ln(PX0, PY0, PX0, PY1, AX) + ln(PX0, PY1, PX1, PY1, AX);

    let s = axes(); const sc = (x, y) => [PX0 + x * (PX1 - PX0), PY1 - y * (PY1 - PY0)];

    vals.forEach((v, i) => { const y = PY0 + i * bh + 3, w = v / 40 * (PX1 - PX0); s += r(PX0, y, w, bh - 6, w > sig - PX0 ? F : G); });

  B_.deseabilidad = () => {
    let s = gy() + axes(); const sc = (x, y) => [PX0 + x * (PX1 - PX0), PY1 - y * (PY1 - PY0)];

  };

  window.buildChartSVG = function (id) {
    const body = (B_[id] || (() => t(W / 2, H / 2, "—", { size: 20 })))();
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${body}</svg>`;
  };

  "barrido-frecuencia": "Dos módulos frente a la frecuencia: G′ (citrón, elástico/sólido) y G″ (gris, viscoso/líquido). Si G′ domina, el material se comporta como gel estructurado.",

  prefmap: "Un mapa PCA de productos (puntos) con vectores de preferencia del consumidor (citrón): los productos en la dirección de los vectores son los más preferidos.",
  cielab: "El plano de color a* (rojo-verde) y b* (amarillo-azul). Cada punto es una medición; la trayectoria (que termina en citrón) muestra cómo cambia el color durante el proceso.",

  "efectos-principales": "Cada tramo une la respuesta media en los niveles de un factor. Pendiente marcada (citrón) = efecto fuerte; línea plana = sin efecto. Líneas no paralelas indicarían interacción.",

  deseabilidad: "La curva citrón combina varias respuestas en un solo índice (0 a 1). Su máximo marca la condición de proceso que mejor concilia todos los objetivos.",
};

</script>

      return '<div data-act="goDecision" data-id="'+d.tarea+'" role="button" class="nv-rowhover" data-hover style="display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 20px;background:var(--carbon-900);cursor:pointer">'+
        '<div style="min-width:0">'+
          '<div style="font-family:var(--font-display);font-size:22px;font-weight:var(--w-medium);line-height:1.05;letter-spacing:var(--tracking-display);color:var(--text)">'+esc(d.q)+'</div>'+
          '<div style="font-family:var(--font-text);font-size:12px;color:var(--text-faint);margin-top:3px">'+esc(d.ej)+'</div>'+
        '</div>'+ICON.arrow+
      '</div>';
    }).join('');
    return ''+
    '<div data-act="closeDecision" data-overlay="1" style="position:fixed;inset:0;background:rgba(10,10,10,0.82);display:flex;align-items:center;justify-content:center;padding:40px;z-index:50;animation:nvfade 160ms var(--ease)">'+
      '<div style="max-width:720px;width:100%;background:var(--carbon-900);border:var(--bw) solid var(--border-strong);border-radius:var(--r-2);box-shadow:var(--shadow-pop);padding:36px 40px 40px;max-height:88vh;overflow-y:auto">'+
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:6px">'+
          '<div><div style="font-family:var(--font-text);font-size:10.5px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--accent);font-weight:var(--w-semibold)">Diagrama de decisión</div>'+
            '<h2 style="font-family:var(--font-display);font-size:44px;font-weight:var(--w-medium);line-height:0.96;letter-spacing:var(--tracking-display);margin:4px 0 0">¿Qué quiero mostrar?</h2></div>'+
          '<div data-act="closeDecision" role="button" class="nv-btnhover" data-hover style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:var(--bw) solid var(--border-strong);border-radius:var(--r-1);cursor:pointer;color:var(--text-muted);flex-shrink:0">'+ICON.close+'</div>'+
        '</div>'+
        '<p style="font-family:var(--font-text);font-size:13px;line-height:1.5;color:var(--text-faint);margin:14px 0 24px;max-width:520px">La pregunta manda sobre el dato. Elegí lo que querés que el lector entienda; el recurso te lleva al grupo de gráficos correcto.</p>'+
        '<div style="display:flex;flex-direction:column;gap:1px;background:var(--border);border:var(--bw) solid var(--border);border-radius:var(--r-2);overflow:hidden">'+rows+'</div>'+
      '</div>'+
    '</div>';
  }

  function render(){
    var at = tarea(state.tareaId);
    root.innerHTML = header() + '<div class="nv-inner" style="display:flex;flex:1;min-height:0">'+rail(at)+main(at)+'</div>' + modal();
  }

  // Delegación de eventos
  root.addEventListener('click', function(ev){
    var el = ev.target.closest('[data-act]');
    if(!el) return;
    var act = el.getAttribute('data-act');
    if(act==='closeDecision'){ if(el.getAttribute('data-overlay') && ev.target!==el) return; state.decisionOpen=false; render(); return; }
    if(act==='openDecision'){ state.decisionOpen=true; render(); return; }
    if(act==='selTarea'){ state.tareaId=el.getAttribute('data-id'); state.chartId=null; render(); return; }
    if(act==='openChart'){ state.chartId=el.getAttribute('data-id'); render(); scrollTop(); return; }
    if(act==='backGrid'){ state.chartId=null; render(); return; }
    if(act==='goDecision'){ state.tareaId=el.getAttribute('data-id'); state.chartId=null; state.decisionOpen=false; render(); return; }
    if(act==='prev'||act==='next'){
      var at=tarea(state.tareaId); var ids=at.charts.map(function(c){return c.id;}); var i=ids.indexOf(state.chartId);
      i += (act==='next'?1:-1); if(i>=0 && i<ids.length){ state.chartId=ids[i]; render(); scrollTop(); }
      return;
    }
  });
  document.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && state.decisionOpen){ state.decisionOpen=false; render(); } });
  function scrollTop(){ var m=document.querySelector('.nv-main'); if(m) m.scrollTop=0; }

  render();
})();
</script>
</body>
</html>
