<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador de gráficos · Proyecto de Operaciones Unitarias</title>
<link rel="stylesheet" href="/classroom-fonts.css">
<style>
:root {
  --accent: #5980A6; --accent-50: #F6F9FC; --accent-100: #EFF4F9; --accent-200: #D3E0EC; --accent-300: #A9C3D8; --accent-700: #2C455D; --accent-d: #416180;
  --text: #1c1b1a; --bg: #fff; --divider: #1c1b1a;
  --n50: #faf9f8; --n100: #f4f2f0; --n200: #e9e6e3; --n300: #d8d5d2; --n400: #b3afab; --n500: #8a8683; --n600: #6b6764; --n700: #4f4b48; --n800: #35322f;
  --neg: #B5502B; --neg-bg: #F7E9E3; --ok: #2F7D5B; --warn: #B7791F;
  --font-body: 'Manrope Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace;
  --top-h: 104px; --rail-w: 272px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.5; }
button, input, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.kick { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.lbl { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--n600); font-weight: 700; }
sub { font-size: 72%; line-height: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- cabecera ---------- */
.top { position: sticky; top: 0; z-index: 40; background: #fff; border-bottom: 2px solid var(--divider); }
.top-row { display: flex; align-items: center; gap: 16px; padding: 12px 22px 8px; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--n300); padding: 6px 11px; border-radius: 999px; color: var(--text); text-decoration: none; font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.back:hover { border-color: var(--text); }
.top-row h1 { font-size: 21px; font-weight: 780; letter-spacing: -.02em; margin: 2px 0 0; line-height: 1.1; }
.top-row .sp { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--n300); padding: 6px 10px; min-width: 240px; background: #fff; }
.search:focus-within { border-color: var(--accent); }
.search input { border: none; outline: none; font-size: 13.5px; width: 100%; background: transparent; }
.tabs { display: flex; gap: 0; padding: 0 22px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: none; background: none; padding: 9px 14px 10px; font-size: 13.5px; font-weight: 650; color: var(--n600); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; gap: 7px; align-items: baseline; }
.tab .n { font-family: var(--font-mono); font-size: 10.5px; color: var(--n500); }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab[aria-selected="true"] .n { color: var(--accent); }

/* ---------- catálogo ---------- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); }
.rail { position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto; border-right: 2px solid var(--divider); background: var(--n50); padding: 14px 0 30px; overscroll-behavior: contain; }
.rail .h { padding: 0 20px 8px; }
.task { display: grid; grid-template-columns: 28px 1fr; gap: 10px; width: 100%; text-align: left; border: none; background: none; padding: 10px 20px; cursor: pointer; border-left: 3px solid transparent; color: var(--text); }
.task:hover { background: #fff; }
.task[aria-current="true"] { background: #fff; border-left-color: var(--accent); }
.task .num { font-family: var(--font-mono); font-size: 13px; color: var(--n500); font-weight: 650; padding-top: 1px; }
.task[aria-current="true"] .num { color: var(--accent); }
.task b { display: block; font-size: 13.5px; font-weight: 700; line-height: 1.3; }
.task span { font-size: 11.5px; color: var(--n600); }
.rail .sec { border-top: 1px solid var(--n300); margin-top: 12px; padding: 14px 20px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1.5px solid var(--n300); background: #fff; padding: 4px 9px; font-size: 11.5px; font-weight: 650; cursor: pointer; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--text); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
.chip .rk { font-family: var(--font-mono); font-size: 10px; opacity: .8; }
.rail p.note { font-size: 12px; color: var(--n600); margin: 10px 0 0; line-height: 1.5; }
.main { min-width: 0; padding: 22px 28px 60px; }
.serie { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.serie h2 { font-size: 30px; font-weight: 800; letter-spacing: -.025em; margin: 2px 0 4px; line-height: 1.1; }
.lead { font-size: 15px; color: var(--n700); margin: 0 0 18px; max-width: 760px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; border: 1.5px solid var(--n300); background: #fff; cursor: pointer; text-align: left; padding: 0; color: var(--text); transition: border-color .15s, transform .15s, box-shadow .15s; position: relative; }
.card:hover { border-color: var(--text); transform: translateY(-3px); box-shadow: 0 8px 22px rgba(28,27,26,.08); }
.card .fig { aspect-ratio: 34 / 21; border-bottom: 1px solid var(--n200); background: #fff; padding: 6px; }
.card .fig svg { width: 100%; height: 100%; display: block; }
.card .bd { padding: 11px 13px 13px; }
.card h3 { font-size: 15.5px; font-weight: 750; margin: 0 0 2px; line-height: 1.25; }
.card .ej { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--n600); }
.card p { font-size: 12.5px; color: var(--n700); margin: 7px 0 0; line-height: 1.45; }
.badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.badge { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding: 2px 6px; background: #fff; border: 1px solid var(--n300); color: var(--n700); }
.badge.live { background: var(--accent); border-color: var(--accent); color: #fff; }
.badge.wk { border-color: var(--accent-300); color: var(--accent-700); }
.empty { padding: 40px 0; color: var(--n600); }

/* ---------- ficha ---------- */
.fnav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--n300); background: #fff; padding: 7px 12px; font-size: 12.5px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--text); text-decoration: none; }
.btn:hover { border-color: var(--text); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.pri:hover { background: var(--accent-d); }
.btn[disabled] { opacity: .4; cursor: default; }
.fnav .sp { flex: 1; }
.fhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.fhead h2 { font-size: 32px; font-weight: 800; letter-spacing: -.025em; margin: 0; line-height: 1.08; }
.ftag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--accent-700); border: 1px solid var(--accent-300); padding: 3px 8px; }
.fgrid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 26px; align-items: start; }
.figbox { border: 1.5px solid var(--n300); background: #fff; position: relative; }
.figbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--n200); flex-wrap: wrap; }
.figtitle { font-size: 16px; font-weight: 750; line-height: 1.3; flex: 1 1 260px; min-width: 0; }
.figtitle.topic { color: var(--n600); font-weight: 650; }
.seg { display: inline-flex; border: 1.5px solid var(--text); background: #fff; }
.seg button { border: none; border-right: 1px solid var(--text); background: #fff; padding: 5px 9px; font-size: 12px; font-weight: 650; cursor: pointer; color: var(--text); white-space: nowrap; }
.seg button:last-child { border-right: none; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg.wide { display: flex; } .seg.wide button { flex: 1; }
.plot { position: relative; padding: 6px 8px 4px; touch-action: pan-y; }
.plot svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: rgba(28,27,26,.92); color: #fff; font-family: var(--font-mono); font-size: 11px; line-height: 1.45; padding: 6px 9px; white-space: nowrap; transform: translate(12px, -50%); z-index: 3; display: none; }
.tip.left { transform: translate(calc(-100% - 12px), -50%); }
.cross { position: absolute; pointer-events: none; width: 11px; height: 11px; border: 2px solid var(--text); border-radius: 50%; background: #fff; transform: translate(-50%, -50%); display: none; z-index: 2; }
.trapbtn { border: 1.5px solid var(--neg); color: var(--neg); background: #fff; padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.trapbtn[aria-pressed="true"] { background: var(--neg); color: #fff; }
.ctl { padding: 12px 14px 14px; border-top: 1px solid var(--n200); display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 18px; background: var(--n50); }
.ctl .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 12.5px; font-weight: 650; color: var(--n800); }
.ctl .row b { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
.ctl select { width: 100%; margin-top: 6px; border: 1.5px solid var(--n300); padding: 6px 8px; font-size: 12.5px; background: #fff; }
.ctl .seg { margin-top: 6px; }
.trapnote { border-left: 4px solid var(--neg); background: var(--neg-bg); padding: 12px 14px; font-size: 13.5px; line-height: 1.55; margin-top: 14px; }
.trapnote b { color: var(--neg); }
.readout { margin-top: 14px; border: 1.5px solid var(--n300); }
.readout table { width: 100%; border-collapse: collapse; font-size: 13px; }
.readout td { padding: 7px 12px; border-bottom: 1px solid var(--n200); vertical-align: top; }
.readout tr:last-child td { border-bottom: none; }
.readout td:last-child { font-family: var(--font-mono); font-size: 12.5px; text-align: right; white-space: nowrap; }
.readout tr:hover td { background: var(--accent-50); }
.src { font-size: 12px; color: var(--n600); margin-top: 12px; line-height: 1.55; }
.src a { color: var(--accent-700); font-weight: 650; }
.fx { display: grid; gap: 16px; }
.fx h4 { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--n600); margin: 0 0 5px; font-weight: 700; }
.fx .blk p { margin: 0; font-size: 14px; line-height: 1.55; }
.fx .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.fx .q { border-left: 4px solid var(--accent); background: var(--accent-50); padding: 12px 14px; }
.fx .q p { font-size: 18px; font-weight: 750; line-height: 1.3; }
.fx .no h4 { color: var(--neg); }
.fx .eth { border-left: 4px solid var(--neg); background: var(--neg-bg); padding: 12px 14px; }
.fx .eth h4 { color: var(--neg); }
.cmbar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 7px; }
.cmbar i { height: 8px; background: var(--n200); display: block; }
.cmbar i.on { background: var(--accent); }
.cmlab { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--n600); margin-top: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--n600); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; display: inline-block; }

/* ---------- decisión ---------- */
.page { max-width: 1180px; margin: 0 auto; padding: 24px 28px 70px; }
.page h2 { font-size: 30px; font-weight: 800; letter-spacing: -.025em; margin: 4px 0 6px; line-height: 1.12; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 18px; }
.qcard { border: 1.5px solid var(--n300); background: #fff; padding: 14px 16px; text-align: left; cursor: pointer; color: var(--text); display: grid; gap: 4px; transition: border-color .15s, transform .15s; }
.qcard:hover { border-color: var(--text); transform: translateY(-2px); }
.qcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -4px 0 var(--accent); }
.qcard .num { font-family: var(--font-mono); font-size: 11px; color: var(--accent); font-weight: 700; }
.qcard b { font-size: 16px; line-height: 1.3; }
.qcard span { font-size: 12.5px; color: var(--n600); }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 14px; }
.opt { display: grid; grid-template-columns: 120px 1fr; gap: 12px; border: 1.5px solid var(--n300); background: #fff; padding: 10px; cursor: pointer; text-align: left; color: var(--text); transition: border-color .15s, transform .15s; }
.opt:hover { border-color: var(--text); transform: translateY(-2px); }
.opt .fig { aspect-ratio: 34 / 21; }
.opt .fig svg { width: 100%; height: 100%; display: block; }
.opt b { font-size: 14px; display: block; line-height: 1.3; }
.opt .c { font-size: 12.5px; color: var(--accent-700); font-weight: 650; margin-top: 3px; display: block; }
.opt .w { font-size: 12px; color: var(--n600); margin-top: 4px; display: block; }
.opt .w em { color: var(--neg); font-style: normal; font-weight: 650; }

/* ---------- laboratorios ---------- */
.lab { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 26px; margin-top: 18px; align-items: start; }
.panel { border: 1.5px solid var(--n300); background: #fff; }
.panel .ph { padding: 10px 14px; border-bottom: 1px solid var(--n200); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel .ph b { font-size: 14.5px; }
.panel .pb { padding: 14px; }
.stage { display: flex; align-items: center; justify-content: center; min-height: 300px; padding: 12px; }
.stage svg { width: 100%; max-width: 640px; height: auto; display: block; }
.answer { display: grid; gap: 10px; padding: 14px; border-top: 1px solid var(--n200); background: var(--n50); }
.answer .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.answer input[type=range] { flex: 1; min-width: 180px; accent-color: var(--accent); }
.big { font-family: var(--font-mono); font-size: 26px; font-weight: 750; min-width: 84px; text-align: right; }
.prog { height: 6px; background: var(--n200); position: relative; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width .25s; }
.side h3 { font-size: 18px; margin: 0 0 8px; font-weight: 780; }
.side p { font-size: 14px; line-height: 1.6; margin: 0 0 12px; color: var(--n800); }
.checks { display: grid; gap: 8px; }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; border: 1.5px solid var(--n300); padding: 9px 11px; cursor: pointer; background: #fff; text-align: left; color: var(--text); font-size: 13px; line-height: 1.45; }
.check:hover { border-color: var(--text); }
.check i { width: 18px; height: 18px; border: 2px solid var(--n500); display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
.check[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-50); }
.check[aria-pressed="true"] i { border-color: var(--accent); background: var(--accent); }
.check[aria-pressed="true"] i::after { content: ''; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check b { display: block; font-size: 13.5px; }
.meter { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--n200); }
.meter .bar { height: 10px; background: var(--n200); position: relative; }
.meter .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width .3s; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv b { font-family: var(--font-mono); text-align: right; }
.flash { position: absolute; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 4; text-align: center; padding: 20px; }
.mc { display: grid; gap: 8px; margin-top: 10px; }
.mc button { text-align: left; border: 1.5px solid var(--n300); background: #fff; padding: 9px 12px; font-size: 13.5px; cursor: pointer; color: var(--text); }
.mc button:hover { border-color: var(--text); }
.mc button.right { border-color: var(--ok); background: #EAF4EE; }
.mc button.wrong { border-color: var(--neg); background: var(--neg-bg); }
.subtabs { display: inline-flex; flex-wrap: wrap; margin-top: 14px; }
.lie { font-family: var(--font-mono); font-size: 40px; font-weight: 800; line-height: 1; }
.lie small { font-size: 14px; font-weight: 600; color: var(--n600); }
.ok-t { color: var(--ok); } .neg-t { color: var(--neg); }

/* ---------- móvil ---------- */
@media (max-width: 980px) {
  .fgrid, .lab { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  :root { --top-h: 0px; }
  .top { position: static; }
  .top-row { flex-wrap: wrap; padding: 10px 16px 6px; gap: 10px; }
  .top-row h1 { font-size: 18px; }
  .search { min-width: 0; width: 100%; order: 5; }
  .tabs { padding: 0 8px; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: none; border-bottom: 2px solid var(--divider); padding: 10px 0 12px; }
  .rail .tasks { display: flex; overflow-x: auto; gap: 6px; padding: 0 16px; scrollbar-width: none; }
  .rail .tasks::-webkit-scrollbar { display: none; }
  .task { grid-template-columns: auto; border-left: none; border: 1.5px solid var(--n300); background: #fff; padding: 6px 10px; flex: 0 0 auto; }
  .task[aria-current="true"] { border-color: var(--accent); }
  .task .num { display: none; }
  .task b { font-size: 12.5px; white-space: nowrap; }
  .task > span > span { display: none; }
  .rail .h, .rail .sec { padding-left: 16px; padding-right: 16px; }
  .rail p.note { display: none; }
  .main, .page { padding: 16px 16px 50px; }
  .serie h2, .page h2 { font-size: 24px; }
  .fhead h2 { font-size: 25px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .fx .two { grid-template-columns: minmax(0, 1fr); }
  .ctl { grid-template-columns: minmax(0, 1fr); }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .opt { grid-template-columns: 96px 1fr; }
  .qgrid { grid-template-columns: minmax(0, 1fr); }
  .readout td:last-child { white-space: normal; }
}
</style>
</head>

<header class="top" id="top">
  <div class="top-row">

    <div>
      <div class="kick">POU · IQYA-2031 · Comunicación visual</div>
      <h1>Explorador de gráficos</h1>
    </div>
    <div class="sp"></div>
    <label class="search" id="searchBox"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="Buscar entre 86 gráficos" aria-label="Buscar un gráfico"></label>
  </div>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" data-tab="decidir"><span class="n">01</span>Elegir el gráfico</button>
    <button class="tab" role="tab" data-tab="catalogo"><span class="n">02</span>Catálogo</button>
    <button class="tab" role="tab" data-tab="cleveland"><span class="n">03</span>Cleveland y McGill</button>
    <button class="tab" role="tab" data-tab="tinta"><span class="n">04</span>Menos tinta</button>

<div id="view"></div>
<script>
/* ====================================================================
   Explorador de gráficos · utilidades
   Formato con coma decimal, PCHIP (idéntico al de SciPy) y un kit de
   gráficos SVG con atributos en línea: las figuras se pueden exportar

/* ====================================================================
   Canónicos en vivo · parte A (semanas 3 a 5 del curso)
   Cada canónico: estado por defecto, controles, fuente de los datos y
   draw(s, o) → { svg, topic, thesis, read, trap, probe }.
   o = { W, H, thumb, trap }. Todo se calcula con las ecuaciones y los
   datos del material del curso; lo externo se declara en src.
   ==================================================================== */
var CANON = {}, CANON_IDS = [];
function canon(id, d) { d.id = id; CANON[id] = d; CANON_IDS.push(id); }
function box(o, m) {
  var th = o.thumb;
  return Object.assign({ W: o.W, H: o.H, l: th ? 38 : 66, r: th ? 40 : 104, t: th ? 10 : 18, b: th ? 26 : 48 }, m || {});
}
function fsOf(o) { return o.thumb ? 8.5 : 11; }
function fmtSize(um) { return um >= 1000 ? fmtN(um / 1000, um >= 10000 ? 0 : 1) + ' mm' : fmtN(um, um < 10 ? 1 : 0) + ' µm'; }
function L10(v) { return Math.log10(v); }
/* sonda genérica: sigue la curva de foco bajo el puntero */
function probeOn(pl, f, xr, fx, fy, lx, ly) {
  return function (px) {
    var x = pl.inX(px); if (!(x >= xr[0] && x <= xr[1])) return null;
    var y = f(x); if (!isFinite(y)) return null;
    var py = pl.Y(y); if (!(py >= pl.y0 - 2 && py <= pl.y1 + 2)) return null;
    return { px: pl.X(x), py: py, lines: [lx + ' = ' + fx(x), ly + ' = ' + fy(y)] };
  };
}
function curve(f, a, b, n, log) { var xs = log ? logspace(a, b, n) : linspace(a, b, n); return xs.map(function (x) { return [x, f(x)]; }); }

/* ---------------------------------------------------------------------

canon('energia-molienda', {

  src: 'Leyes de Rittinger, Kick y Bond de la Lectura 03, con E = 10·W_i·(1/√P₈₀ − 1/√F₈₀). W_i ≈ 14 kWh/t es el índice aproximado de la cáscara de cítrico que da la sesión de Propiedades de sólidos. Kick y Rittinger se calibran en el punto de operación, como en el Explorador de molienda.',

  ctl: [
    { k: 'lF', t: 'range', lab: 'Alimentación F_{80}', min: 3.3, max: 4.5, step: 0.005, fmt: function (v) { return fmtSize(Math.pow(10, v)); } },

    { k: 'Wi', t: 'range', lab: 'Índice de trabajo de Bond W_i', min: 6, max: 20, step: 0.5, fmt: function (v) { return fmtN(v, 1) + ' kWh/t'; } }
  ],
  trapLabel: 'Usar Kick para la molienda fina',
  draw: function (s, o) {
    var F = Math.pow(10, s.lF), Pc = Math.min(Math.pow(10, s.lPc), F / 1.5), Wi = s.Wi;
    var bond = function (p) { return 10 * Wi * (1 / Math.sqrt(p) - 1 / Math.sqrt(F)); };
    var Ec = bond(Pc), CK = Ec / Math.log(F / Pc), CR = Ec / (1 / Pc - 1 / F);
    var kick = function (p) { return CK * Math.log(F / p); }, ritt = function (p) { return CR * (1 / p - 1 / F); };
    // la curva cae a cero cuando P₈₀ → F₈₀; se corta en F/1,6 para no gastar media escala logarítmica en esa caída
    var xmin = 20, xmax = F / 1.6, nice125 = function (v, up) { var e = Math.floor(L10(v)), m = v / Math.pow(10, e), c = up ? [1, 2, 5, 10].filter(function (k) { return k >= m * 0.999; })[0] : [10, 5, 2, 1].filter(function (k) { return k <= m * 1.001; })[0]; return c * Math.pow(10, e); };
    var ymax = nice125(ritt(xmin) * 1.12, true), ymin = Math.max(nice125(Math.max(1e-3, Math.min(ritt(xmax), bond(xmax), kick(xmax)) / 1.1), false), ymax / 1e5);

    var g = pl.frame({ fs: fsOf(o) }), fs = fsOf(o);

    laws.forEach(function (L) { g += pl.line(curve(L.f, xmin, xmax, 160, true), { c: L.c, w: L.w, d: L.d }); });
    // rótulos directos en el extremo fino, donde las leyes se separan, con la forma de cada ley debajo del nombre
    var labs = laws.map(function (L) { return { y: pl.Y(L.f(xmin)) - (o.thumb ? 6 : 20), s: L.n, eq: L.eq, c: L.c === P.foc ? P.focD : P.ctxD }; });

});

    { k: 'n', t: 'range', lab: 'Uniformidad n (Rosin-Rammler)', min: 0.6, max: 3, step: 0.05, fmt: function (v) { return fmtN(v, 2); } },

  ],

  calc: function (s) {
    var n = s.n, d50 = Math.pow(10, s.ld50), x63 = d50 / Math.pow(Math.LN2, 1 / n), xmin = s.xmin;
    var Q3 = function (x) { return 1 - Math.exp(-Math.pow(x / x63, n)); };
    var dq3 = function (x) { var u = Math.pow(x / x63, n); return n * u * Math.exp(-u); }; // dQ3/d ln x
    var N = 2400, l0 = Math.log(xmin), l1 = Math.log(x63 * Math.pow(40, 1 / n)), dl = (l1 - l0) / N, cum = [0], xs = [xmin], wsum = 0, inv = 0;
    for (var i = 1; i <= N; i++) {

      var wa = dq3(xa) / (xa * xa * xa), wb = dq3(xb) / (xb * xb * xb);

/* chartSvg.js: motor de gráficos SVG del explorador.
   window.buildChartSVG(id, {focus}) -> string SVG.
   Paleta del curso: gris = contexto, azul = foco (lo que importa), ladrillo = señal negativa. */
(function () {
  const G = "#B3B8BE";        // contexto
  const GD = "#7A7F86";       // contexto, un paso más oscuro
  const F = "#5980A6";        // foco (acero)
  const CL = "#B5502B";       // señal negativa (ladrillo)
  const B = "#1A1A1A";        // texto sobre papel
  const TX = "#71717A";       // texto tenue
  const DK = "#3F3F46";       // dato fuerte que no es el foco
  const GRID = "rgba(26,26,26,0.08)";
  const AX = "rgba(26,26,26,0.32)";
  const W = 340, H = 210;
  const PX0 = 38, PX1 = 326, PY0 = 16, PY1 = 180;

  const r = (x, y, w, h, fill, o = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" ${o}/>`;
  const ln = (x1, y1, x2, y2, s = AX, w = 1, o = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" ${o}/>`;
  const c = (cx, cy, rad, fill, o = "") => `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="${fill}" ${o}/>`;
  const p = (d, s, fill = "none", w = 1.5, o = "") => `<path d="${d}" stroke="${s}" fill="${fill}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${o}/>`;
  const t = (x, y, s, { fill = TX, size = 9, anchor = "middle", weight = 400, ff = "Barlow,sans-serif", ls = "0" } = {}) =>
    `<text x="${x}" y="${y}" fill="${fill}" font-size="${size}" text-anchor="${anchor}" font-weight="${weight}" font-family="${ff}" letter-spacing="${ls}">${s}</text>`;
  const axes = () => ln(PX0, PY0, PX0, PY1, AX) + ln(PX0, PY1, PX1, PY1, AX);
  const gy = (n = 4) => { let s = ""; for (let i = 1; i <= n; i++) { const y = PY1 - (PY1 - PY0) * i / n; s += ln(PX0, y, PX1, y, GRID); } return s; };
  const poly = (pts, s, fill = "none", w = 1.5) => p("M" + pts.map(a => a[0].toFixed(1) + " " + a[1].toFixed(1)).join(" L "), s, fill, w);
  // trazo suavizado (Catmull-Rom -> Bézier). closed=true cierra la figura.
  function smoothD(pts, closed = false) {
    if (pts.length < 3) return "M" + pts.map(a => a[0].toFixed(1) + " " + a[1].toFixed(1)).join(" L ");
    const P = closed ? [pts[pts.length - 1], ...pts, pts[0], pts[1]] : pts;
    let d = "M" + P[closed ? 1 : 0][0].toFixed(1) + " " + P[closed ? 1 : 0][1].toFixed(1);
    const start = closed ? 1 : 0, end = closed ? P.length - 2 : P.length - 1;
    for (let i = start; i < end; i++) {
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += `C${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d + (closed ? "Z" : "");
  }
  const spline = (pts, s, fill = "none", w = 1.5, closed = false) => p(smoothD(pts, closed), s, fill, w);
  const map = (arr, lo, hi, a, b) => arr.map(v => a + (b - a) * (v - lo) / (hi - lo));
  const xlab = (s) => t((PX0 + PX1) / 2, H - 3, s, { size: 8.5, ls: "0.05em" });
  const ylab = (s) => `<text x="11" y="${(PY0 + PY1) / 2}" fill="${TX}" font-size="8.5" text-anchor="middle" font-family="Barlow,sans-serif" transform="rotate(-90 11 ${(PY0 + PY1) / 2})">${s}</text>`;

  // barras verticales genéricas
  function vbars(vals, focusIdx, opts = {}) {
    const max = Math.max(...vals) * 1.12;
    const n = vals.length, gap = 8, bw = (PX1 - PX0 - gap * (n + 1)) / n;
    let s = gy() + axes();
    vals.forEach((v, i) => {
      const x = PX0 + gap + i * (bw + gap);
      const h = (v / max) * (PY1 - PY0);
      const col = (opts.neg && opts.neg.includes(i)) ? CL : (i === focusIdx ? F : G);
      s += r(x, PY1 - h, bw, h, col);
    });
    return s;
  }

  const B_ = {}; // builders

  /* ---------- 01 COMPARAR ---------- */
  B_.barras = () => vbars([62, 71, 58, 88, 66, 74], 3) + ylab("Rendimiento (%)") + xlab("Lote");
  B_["barras-agrupadas"] = () => {
    const grp = [[70, 52, 38], [64, 44, 30], [58, 40, 26], [50, 33, 20]];
    const cols = [G, GD, F]; const max = 80, gw = (PX1 - PX0) / grp.length;
    let s = gy() + axes();
    grp.forEach((g, i) => { const bx = PX0 + i * gw + 8, bw = (gw - 20) / 3; g.forEach((v, j) => { const h = v / max * (PY1 - PY0); s += r(bx + j * bw, PY1 - h, bw - 1.5, h, cols[j]); }); });
    return s + ylab("Humedad (%)") + xlab("Tiempo de secado");
  };
  B_["barras-apiladas"] = () => {
    const data = [[30, 22, 34, 8], [26, 30, 30, 10], [34, 18, 38, 6], [28, 26, 32, 9], [30, 24, 33, 8]];
    const cols = [GD, G, F, "#D2D6DA"]; const gap = 12, bw = (PX1 - PX0 - gap * 6) / 5;
    let s = axes();
    data.forEach((st, i) => { const x = PX0 + gap + i * (bw + gap); let acc = 0; const tot = st.reduce((a, b) => a + b, 0); st.forEach((v, j) => { const h = v / (tot * 1.05) * (PY1 - PY0); s += r(x, PY1 - acc - h, bw, h, cols[j]); acc += h; }); });
    return s + ylab("g/100g") + xlab("Producto");
  };
  B_["barras-100"] = () => {
    const data = [[45, 30, 25], [38, 40, 22], [55, 20, 25], [30, 35, 35], [48, 28, 24]];
    const cols = [G, F, GD]; const gap = 12, bw = (PX1 - PX0 - gap * 6) / 5;
    let s = axes();
    data.forEach((st, i) => { const x = PX0 + gap + i * (bw + gap); let acc = 0; st.forEach((v, j) => { const h = v / 100 * (PY1 - PY0); s += r(x, PY1 - acc - h, bw, h, cols[j]); acc += h; }); });
    return s + ylab("% defectos") + xlab("Línea");
  };
  B_.dotplot = () => {
    const before = [30, 42, 55, 38, 62, 48, 70, 35], after = [45, 58, 60, 52, 78, 66, 82, 50];

      g += svgRect(x0, yT, x1 - x0, pl.y1 - yT, { f: col });
      g += svgText((x0 + x1) / 2, pl.y1 + 18, c, { a: 'middle', fs: 11, c: P.mut });
      reads.push((pl.y1 - dy - yT) / sc);
    });
    $('#tf').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" font-family="' + FONT + '">' + g + '</svg>';
    var e = reads[2] - vals[2];
    $('#t3r').innerHTML = d ? '<div class="lie"><span class="neg-t">' + fmtN(reads[2], 1) + ' %</span> <small>contra ' + fmtN(vals[2], 0) + ' % real</small></div><p style="margin-top:10px">Contra la rejilla del fondo, el borde frontal de la barra de agitación se lee en ' + fmtN(reads[2], 1) + ' %: ' + fmtN(Math.abs(e), 1) + ' puntos menos, ' + pct(Math.abs(e) / vals[2], 0) + ' del valor. Las barras pequeñas pierden más, en proporción, que las grandes: el error no es parejo.</p>' : '<div class="lie"><span class="ok-t">' + fmtN(vals[2], 0) + ' %</span> <small>se lee lo que es</small></div><p style="margin-top:10px">En 2D el borde de la barra y la rejilla están en el mismo plano.</p>';
  }
  $$('#d3s button').forEach(function (b) { b.addEventListener('click', function () { TR.d3 = b.dataset.v === '1'; trap3D(box); }); });
  $('#dp').addEventListener('input', function () { TR.depth = +this.value; TR.d3 = true; $$('#d3s button').forEach(function (b) { b.setAttribute('aria-pressed', String((b.dataset.v === '1') === TR.d3)); }); draw(); });
  draw();
}
function trapPastel(box) {
  var cats = ['Cáscara', 'Etanol', 'Vapor', 'Electricidad', 'Ácido', 'Agua', 'Empaque'], vals = [24, 21, 16, 14.5, 11, 8, 5.5];
  if (!TR.pie) TR.pie = { asked: false, pick: null };
  box.innerHTML = '<div class="lab"><div class="panel"><div class="ph"><b>Costo variable de la planta por insumo (ilustrativo)</b></div><div class="stage" id="pf"></div><div class="answer" id="pa"></div></div>' +
    '<div class="side"><h3>Comparar ángulos es impreciso</h3><p>Con más de tres o cuatro categorías, las barras ordenadas ganan siempre: posición sobre una escala común contra ángulo, dos peldaños de la jerarquía. Y si importa el total además de la composición, la barra apilada o el waterfall dicen las dos cosas.</p><p id="pr"></p></div></div>';
  function pieSVG(showBars) {
    var W = 640, H = 330, cx = 165, cy = 165, R = 130, a = -90, s = '', tot = vals.reduce(function (x, y) { return x + y; }, 0);
    var tone = [P.foc, P.ctxD, P.ctx, '#9AA0A7', P.ctxL, '#CBCFD4', '#E0E3E6'];
    vals.forEach(function (v, i) {
      var da = 360 * v / tot, a0 = a * Math.PI / 180, a1 = (a + da) * Math.PI / 180, l = da > 180 ? 1 : 0;
      s += '<path d="M' + cx + ' ' + cy + ' L' + r1(cx + R * Math.cos(a0)) + ' ' + r1(cy + R * Math.sin(a0)) + ' A' + R + ' ' + R + ' 0 ' + l + ' 1 ' + r1(cx + R * Math.cos(a1)) + ' ' + r1(cy + R * Math.sin(a1)) + ' Z" fill="' + tone[i] + '" stroke="#fff" stroke-width="1.5"/>';
      var am = (a + da / 2) * Math.PI / 180; s += svgText(cx + (R + 16) * Math.cos(am), cy + (R + 16) * Math.sin(am) + 4, String.fromCharCode(65 + i), { a: 'middle', fs: 13, fw: 800, c: P.ink });
      a += da;
    });
    if (showBars) {
      var pl = Plot({ W: 310, H: H, l: 96, r: 30, t: 20, b: 30, x: { min: 0, max: 25, ticks: [0, 5, 10, 15, 20, 25], dec: 0 }, y: { min: 0, max: 7, ticks: [] } });
      var g = pl.frame({ fs: 10.5, grid: true });
      var ord = vals.map(function (v, i) { return i; }).sort(function (x, y) { return vals[y] - vals[x]; });
      ord.forEach(function (i, k) { var y = pl.Y(6.6 - k); g += svgRect(pl.x0, y - 11, pl.X(vals[i]) - pl.x0, 22, { f: i === 2 || i === 3 ? P.foc : P.ctx }) + svgText(pl.x0 - 6, y + 4, String.fromCharCode(65 + i) + ' · ' + cats[i], { a: 'end', fs: 11, c: P.ink }) + svgText(pl.X(vals[i]) + 5, y + 4, fmtN(vals[i], 1) + ' %', { fs: 10.5, c: P.mut, mono: true }); });
      s += '<g transform="translate(330,0)">' + g + '</g>';
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" font-family="' + FONT + '">' + s + '</svg>';
  }
  function draw() {
    var st = TR.pie, done = st.pick !== null;
    $('#pf').innerHTML = pieSVG(done);
    $('#pa').innerHTML = done ? '<div class="row"><button class="btn" id="prs">Repetir</button></div>' : '<div class="row"><span style="font-weight:700;font-size:13.5px">¿Qué tajada es mayor: C o D?</span><button class="btn" data-p="C">C</button><button class="btn" data-p="D">D</button><button class="btn" data-p="=">Iguales</button></div>';
    if (done) {
      var ok = st.pick === 'C';
      $('#pr').innerHTML = '<b class="' + (ok ? 'ok-t' : 'neg-t') + '">' + (ok ? 'Acertó' : 'No acertó') + '.</b> C es el vapor, con 16 % del costo, y D la electricidad, con 14,5 %: una diferencia de 1,5 puntos, 10 % del valor. En el pastel son dos ángulos de ' + fmtN(360 * 0.16, 0) + '° y ' + fmtN(360 * 0.145, 0) + '° con orientaciones distintas; en las barras ordenadas, dos longitudes sobre la misma base.';
      $('#prs').addEventListener('click', function () { TR.pie = { asked: false, pick: null }; draw(); });
    } else $$('#pa [data-p]').forEach(function (b) { b.addEventListener('click', function () { TR.pie.pick = b.dataset.p; draw(); }); });
  }
  draw();
}
