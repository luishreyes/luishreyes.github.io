<svg class="clevenger" viewBox="0 0 760 880" role="img" aria-label="Aparato tipo Clevenger: un matraz de fondo redondo con la cáscara y el agua sobre una manta calefactora; el vapor de agua y aceite sube por el tubo de vapor y cruza a un condensador de bolas enfriado con agua, que entra abajo y sale arriba; el condensado cae al tubo graduado, donde el aceite flota sobre el agua y se lee en mililitros; una llave en el fondo deja sacar el condensado, y el brazo de retorno, lleno de agua, la devuelve al tubo de vapor y al matraz; un tubo lateral sirve para llenarlo." xmlns="http://www.w3.org/2000/svg" style="width:100%;min-width:520px;height:auto;display:block;font-family:system-ui,sans-serif"><defs><marker id="cv-flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#19222F"/></marker></defs><path d="M62,702 C62,824 338,824 338,702 Z" fill="#6E6A00"/><path d="M84,702 C84,800 316,800 316,702 Z" fill="#565200"/><circle cx="200" cy="690" r="104" fill="#fff" stroke="#19222F" stroke-width="3.5"/><path d="M96.5,700 A104,104 0 0 0 303.5,700 Z" fill="#DDE6EE"/><rect x="141" y="724" width="18" height="8" rx="2" fill="#E0B400" transform="rotate(-20 150 728)"/><rect x="177" y="738" width="18" height="8" rx="2" fill="#E0B400" transform="rotate(15 186 742)"/><rect x="217" y="720" width="18" height="8" rx="2" fill="#E0B400" transform="rotate(-8 226 724)"/><rect x="159" y="756" width="18" height="8" rx="2" fill="#E0B400" transform="rotate(30 168 760)"/><rect x="239" y="748" width="18" height="8" rx="2" fill="#E0B400" transform="rotate(-28 248 752)"/><rect x="197" y="766" width="18" height="8" rx="2" fill="#E0B400" transform="rotate(5 206 770)"/><rect x="123" y="744" width="18" height="8" rx="2" fill="#E0B400" transform="rotate(12 132 748)"/><circle cx="200" cy="690" r="104" fill="none" stroke="#19222F" stroke-width="3.5"/><rect x="182" y="556" width="36" height="40" fill="#fff" stroke="#19222F" s