<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Explorador de agitación · Proyecto de Operaciones Unitarias</title>
<link rel="preconnect" href="https://use.typekit.net" crossorigin>

<style>
/* Solo lo propio de este explorador: los botones de a varios que no caben en una fila, los mandos y las lecturas del
   tanque en corte, y las tablas de las figuras en HTML. */
.xl-seg[aria-labelledby^="c-imp"], .xl-seg[aria-labelledby^="c-fluid"], .xl-seg[aria-labelledby^="c-crit"], .xl-seg[aria-labelledby^="c-pared"] {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5px; background: var(--navy);
}
.xl-seg[aria-labelledby^="c-pared"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.xl-seg[aria-labelledby^="c-fluid"] button:last-child:nth-child(3n+1), .xl-seg[aria-labelledby^="c-crit"] button:last-child:nth-child(3n+1) { grid-column: 1 / -1; }
.xl-seg[aria-labelledby^="c-imp"] button + button, .xl-seg[aria-labelledby^="c-fluid"] button + button,
.xl-seg[aria-labelledby^="c-crit"] button + button, .xl-seg[aria-labelledby^="c-pared"] button + button { border-left: 0; }
.xl-datos .xl-seg[aria-labelledby^="c-imp"] button, .xl-datos .xl-seg[aria-labelledby^="c-fluid"] button,
.xl-datos .xl-seg[aria-labelledby^="c-crit"] button { white-space: normal; line-height: 1.15; }

/* El tanque en corte: las lecturas arriba y los mandos de la animación abajo, sobre el lienzo */
.ag-hud { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; }
.ag-hud span { padding: 1px 8px; background: var(--nieve); border: 1px solid var(--borde); font-size: var(--t-xs); line-height: 1.6; white-space: nowrap; }
.ag-hud span.acento { background: var(--navy); border-color: var(--navy); color: #fff; }
.ag-hud span.alerta { border-color: var(--alerta); color: var(--alerta); font-weight: 600; }
.ag-barra { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; pointer-events: none; }
.ag-barra > * { pointer-events: auto; }
.ag-barra.ag-der { left: auto; justify-content: flex-end; }
.ag-barra.ag-der .ag-menu > div { left: auto; right: 0; }
.ag-barra button, .ag-menu > summary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 36px; min-height: 36px; padding: 0 10px;
  border: 1.5px solid var(--navy); background: var(--nieve); color: var(--navy); font-size: var(--t-xs); font-weight: 600; white-space: nowrap;
}
.ag-barra button:hover, .ag-menu > summary:hover { background: var(--amarillo-claro); }
.ag-barra .xl-ico { width: 16px; height: 16px; }
.ag-menu { position: relative; }
.ag-menu > summary { list-style: none; cursor: pointer; }
.ag-menu > summary::-webkit-details-marker { display: none; }
.ag-menu[open] > summary { background: var(--navy); color: #fff; }
.ag-menu > div { position: absolute; left: 0; bottom: calc(100% + 4px); z-index: 3; display: grid; gap: 4px; width: max-content; max-width: 260px; padding: 8px; background: var(--nieve); border: 1.5px solid var(--navy); }
.ag-menu > div button { justify-content: flex-start; width: 100%; }
.ag-menu > div button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.ag-menu > div p { margin: 2px 0 0; font-size: var(--t-xs); line-height: 1.35; color: var(--sec); white-space: normal; }
.ag-lienzo canvas { cursor: crosshair; }
.ag-nt { text-transform: none; letter-spacing: 0; }

/* Las figuras en HTML: tablas, la hoja de datos y el diagnóstico */
.ag-html { padding: 10px 14px 16px; font-size: var(--t-s); line-height: 1.4; }
.ag-tabla { width: 100%; border-collapse: collapse; font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
.ag-tabla th, .ag-tabla td { padding: 5px 6px; border-bottom: 1px solid var(--zona); text-align: right; white-space: nowrap; vertical-align: top; }
.ag-tabla th { color: var(--oliva-osc); font-weight: 600; letter-spacing: .03em; }
.ag-tabla td:first-child, .ag-tabla th:first-child { text-align: left; }
.ag-tabla td small { display: block; color: var(--sec); font-size: var(--t-xs); font-weight: 400; white-space: normal; }
.ag-tabla tr.on td { background: var(--amarillo-claro); font-weight: 600; }
.ag-tabla td.k { font-weight: 600; text-decoration: underline; text-decoration-color: var(--oliva); text-underline-offset: 3px; }
.ag-tabla .al { color: var(--alerta); font-weight: 600; }
.ag-tabla tr[data-crit] { cursor: pointer; }
.ag-tabla tr[data-crit]:hover td { background: var(--claro); }
.ag-nota { margin: 10px 0 0; font-size: var(--t-xs); line-height: 1.45; color: var(--sec); }
.ag-nota b { color: var(--navy); }
.ag-hoja { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0; margin: 0; font-size: var(--t-xs); }
.ag-hoja dt { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--zona); color: var(--sec); }
.ag-hoja dd { margin: 0; padding: 5px 0; border-bottom: 1px solid var(--zona); text-align: right; font-weight: 600; }
.ag-hoja dd.al { color: var(--alerta); }
.ag-hoja h4 { grid-column: 1 / -1; margin: 12px 0 2px; font-size: var(--t-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--oliva-osc); }
.ag-hoja h4:first-child { margin-top: 0; }
.ag-diag { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ag-diag li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 8px 10px; background: var(--blanco); border-left: 4px solid var(--guia); font-size: var(--t-xs); line-height: 1.45; }
.ag-diag li.c { border-left-color: var(--alerta); }
.ag-diag li.c .xl-ico { color: var(--alerta); }
.ag-diag li.ok { border-left-color: var(--navy); }
.ag-diag .xl-ico { width: 18px; height: 18px; margin-top: 1px; }
.ag-diag .e { display: block; font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--oliva-osc); }
.ag-diag li.c .e { color: var(--alerta); }

@media (max-width: 1099.98px), (max-height: 599.98px) {
  /* las nueve escenas, en una sola fila de botones que se acomoda */
  .xl-riel { display: flex !important; flex-direction: row !important; flex-wrap: wrap; gap: 6px; }
  .xl-riel .xl-parte { display: contents !important; }
  .xl-riel .xl-sn { flex: 1 1 28% !important; width: auto !important; min-width: 0 !important; }
  .ag-barra button, .ag-menu > summary { min-width: 44px; min-height: 44px; }
}
@media (pointer: coarse) {
  .ag-barra button, .ag-menu > summary { min-width: 44px !important; min-height: 44px !important; }
}
</style>
