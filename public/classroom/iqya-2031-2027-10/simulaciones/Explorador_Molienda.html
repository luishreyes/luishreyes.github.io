.xl-iso canvas.ml-live { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.xl-rot .ml-tab { color: var(--sec); font-weight: 400; }

/* la serie de tamices: dos nombres largos en una fila */

/* las tablas, como las del libro: filetes finos, cabeceras en versalitas oliva */
.ml-tabla { width: 100%; border-collapse: collapse; font-size: var(--t-xs); line-height: 1.3; }
.ml-tabla th { padding: 6px 6px; text-align: left; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--oliva-osc); border-bottom: 1.5px solid var(--navy); vertical-align: bottom; }

.ml-nota { margin: 10px 0 0; font-size: var(--t-xs); line-height: 1.45; color: var(--sec); }

.ml-sel { padding: 6px 12px 12px; }

.ml-maq td button { display: block; width: 100%; min-height: 40px; padding: 4px 6px; border: 0; border-left: 4px solid transparent; background: none; text-align: left; font-size: var(--t-xs); }
.ml-maq td button:hover { background: var(--amarillo-claro); }
.ml-maq tr.sel td { background: var(--papel); }

.ml-maq td.mal { color: var(--alerta); font-weight: 600; }
.ml-sel-pie { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; margin-top: 12px; }

.ml-avisos { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

.ml-avisos li.c { color: var(--alerta); }
.ml-avisos li.c span { border-color: var(--alerta); }
.ml-ok { margin: 0; font-size: var(--t-xs); line-height: 1.45; }
.ml-ficha { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; margin: 0; font-size: var(--t-xs); line-height: 1.35; }
.ml-ficha dt { color: var(--sec); }
.ml-ficha dd { margin: 0; font-weight: 600; }

.ml-cad { padding: 6px 14px 12px; }
.ml-flujo td { font-size: var(--t-s); padding: 6px 6px; }
.ml-flujo td:first-child { width: 60%; }
.ml-flujo td.op { width: 28px; text-align: center; color: var(--sec); }
.ml-flujo td:last-child { text-align: right; white-space: nowrap; font-weight: 600; }

.ml-tam { padding: 4px 14px 12px; }
.ml-serie { margin: 4px 0 6px; font-size: var(--t-xs); font-weight: 600; color: var(--oliva-osc); }
.ml-tamiz td:nth-child(n+2), .ml-tamiz th:nth-child(n+2) { text-align: right; }

@media (max-width: 1099px), (max-height: 599px) {
  .ml-sel-pie { grid-template-columns: minmax(0, 1fr); }
  .ml-maq { font-size: var(--t-xs); }
}
.ml-tamiz th { letter-spacing: 0; text-transform: none; font-size: var(--t-xs); }
.ml-tamiz th, .ml-tamiz td { padding-left: 4px; padding-right: 4px; }

@media (max-height: 820px) and (min-width: 1100px) { .ml-flujo td { font-size: var(--t-xs); padding: 4px 6px; } }
.ml-tabla th.sym { text-transform: none; font-style: italic; letter-spacing: 0; }

<script id="modelo">
/* El modelo de molienda y tamizado, con las ecuaciones, las correcciones y los datos del capítulo 7 del libro
   (herramientas/molienda-carbonato.py, que escribe el caso de la planta del carbonato). Todo el cálculo vive en
   compute(s), una función pura que no toca la página. Unidades: tamaños en µm, capacidad en t/h (tonelada métrica),
   energía en kWh/t, potencia en kW.
   · Energía: la ley de Bond (ecuación 7.3) con el índice de su tabla, por tonelada corta, pasado a tonelada métrica;
     en el molino de bolas, las correcciones de la tabla 7.1 (en seco, diámetro, alimentación gruesa, finura por
     debajo de 70 µm y razón de reducción menor que 3). Las demás máquinas van con Bond sin corregir, como el
     ejemplo 7.1 lleva la trituradora y el molino de martillos.

<script>
/* El explorador: el armazón (/classroom/explorador-libro.js) pone la página; aquí van los controles, las
   configuraciones y las ocho escenas, en tres partes: la máquina, la energía y el producto. Las figuras de las
   máquinas y de la tamizadora son las isométricas de scripts/figuras/molienda, movidas por las simulaciones de
   partículas de siempre (MillAnim y SieveAnim), que ahora corren con el reloj del armazón. */
(function () {
  'use strict';
  var M = window.Modelo;
  var D = XL.dib, C = D.C, s = D.el, tx = D.texto, set = D.attrs, entre = D.entre;
  var num = XL.num, un = XL.un, pct = XL.pct, kn = XL.kn, kc = XL.kc, NB = XL.NB, esc = XL.esc;
  var MATS = M.MATERIALS, MILLS = M.MILLS;
  var SANS = '"ff-dax-pro", "Archivo Variable", system-ui, sans-serif';

  /* ================= Formato ================= */
  function tam(um) { return M.fmtSize(um).replace(' ', NB); }
  function capTxt(c) { return un(c, c < 10 ? 1 : 0, 't/h'); }
  function kw(v) { return v == null ? 'más de 20 MW' : un(v, v < 10 ? 2 : v < 100 ? 1 : 0, 'kW'); }
  // un motor de la serie IEC, con los decimales de su tamaño (0,37; 2,2; 11; 18,5)
  function kwMot(v) { if (v == null) return 'más de 20 MW'; var d = Math.round(v * 100) % 10 ? 2 : Math.round(v * 10) % 10 ? 1 : 0; return un(v, d, 'kW'); }
  function kwN(v) { return num(v, v < 10 ? 2 : v < 100 ? 1 : 0); }
  function log(x) { return Math.log10(x); }
  function mill(id) { return M.byId(MILLS, id); }
  function mat(id) { return M.byId(MATS, id); }
  var CORTO = { cascarah: 'Cáscara húmeda', caliza: 'Caliza', carbon: 'Carbón', maiz: 'Maíz', azucar: 'Azúcar', arcilla: 'Arcilla', cascara: 'Cáscara seca' };
  var DEL = { mand: 'la trituradora de mandíbulas', rod: 'el molino de rodillos', mart: 'el molino de martillos', bolas: 'el molino de bolas', cuch: 'el molino de cuchillas', disc: 'el molino de discos' };
  function de(id) { return DEL[id].replace(/^el /, 'del ').replace(/^la /, 'de la '); }
  function nAvisos(n) { return n === 1 ? 'un aviso' : n + NB + 'avisos'; }
  // la primera oración de un aviso del modelo, escapada (los avisos traen «<» y paréntesis)
  function corto(t) { var i = t.indexOf('. '); return esc(i > 0 ? t.slice(0, i + 1) : t); }
  // cada máquina con la corriente del estudiante: sirve sin avisos, con avisos o no sirve
  function cuenta(r) {
    var out = { ok: [], adv: [], inv: [], res: {} };
    MILLS.forEach(function (m) {
      var q = M.calcular(Object.assign({}, r.s, { mill: m.id }));
      out.res[m.id] = q;
      out[q.status === 'viable' ? 'ok' : q.status === 'advertencias' ? 'adv' : 'inv'].push(m.id);
    });
    return out;
  }
  function listaLarga(ids) {
    var t = ids.map(function (id) { return DEL[id]; });
    return t.length < 2 ? t.join('') : t.slice(0, -1).join(', ') + ' y ' + t[t.length - 1];
  }
  function lista(ids) {
    var t = ids.map(function (id) { return mill(id).short.toLowerCase(); });
    return t.length < 2 ? t.join('') : t.slice(0, -1).join(', ') + ' y ' + t[t.length - 1];
  }
  // el molino de bolas con el material y la corriente del estudiante, aunque el equipo escogido sea otro
  function deBolas(r) { return r.mill.id === 'bolas' ? r : M.calcular(Object.assign({}, r.s, { mill: 'bolas' })); }

  /* ================= Los controles: cada uno cambia solo su clave ================= */
  function esHumeda(st) { return !!mat(st.mat).noBond; }
  var CONTROLES = {
    mat: { etiqueta: 'Material', tipo: 'opciones', columnas: 2, opciones: MATS.map(function (m) { return { valor: m.id, texto: CORTO[m.id] }; }) },
    mill: { etiqueta: 'Equipo', tipo: 'opciones', columnas: 3, opciones: MILLS.map(function (m) { return { valor: m.id, texto: m.short }; }) },
    modo: { etiqueta: 'Modo de operación', tipo: 'opciones', opciones: [{ valor: 'seca', texto: 'En seco' }, { valor: 'hum', texto: 'En húmedo' }] },
    hum: { etiqueta: 'Humedad del material, w', paso: 0.5, decimales: 1, unidad: '%', nota: 'en base seca; solo en seco',
      min: function (st) { return esHumeda(st) ? 233 : 0; }, max: function (st) { return esHumeda(st) ? 400 : 25; },
      formato: function (v) { return v > 40 ? un(v, 0, '%') + ' (' + num(100 * v / (100 + v), 0) + NB + '% b.' + NB + 'h.)' : un(v, 1, '%'); } },
    sol: { etiqueta: 'Sólidos en la pulpa, Cw', min: 30, max: 80, paso: 1, decimales: 0, unidad: '%', nota: 'solo en húmedo' },
    cEsp: { etiqueta: 'Consumo específico de corte', min: 5, max: 20, paso: 0.5, decimales: 1, unidad: 'kWh/t', nota: 'por tonelada de cáscara húmeda' },
    cWi: { etiqueta: 'Wi de la cáscara seca', min: 3, max: 40, paso: 0.1, decimales: 1, unidad: 'kWh/t', nota: 'el de su ensayo' },
    cCp: { etiqueta: 'cp de la cáscara seca', min: 0.8, max: 2.5, paso: 0.05, decimales: 2, unidad: 'kJ/(kg·K)' },
    cTmax: { etiqueta: 'Temperatura límite de la cáscara seca', min: 40, max: 120, paso: 1, decimales: 0, unidad: '°C' },
    lF: { etiqueta: 'Alimentación, F₈₀', min: 2.7, max: 6, paso: 0.01, formato: function (v) { return tam(Math.pow(10, v)); } },
    lP: { etiqueta: 'Producto objetivo, P₈₀', min: 1.3, max: 5.5, paso: 0.01, formato: function (v) { return tam(Math.pow(10, v)); } },
    lC: { etiqueta: 'Capacidad de sólido seco', min: -0.7, max: 3, paso: 0.01, formato: function (v) { return capTxt(Math.pow(10, v)); } },
    phi: { etiqueta: 'Velocidad, φ', min: 30, max: 120, paso: 1, decimales: 0, unidad: '%', nota: 'fracción de la crítica' },
    D: { etiqueta: 'Diámetro interno del tambor, D', min: 0.5, max: 5, paso: 0.1, decimales: 1, unidad: 'm' },
    J: { etiqueta: 'Carga de bolas, J', min: 20, max: 45, paso: 1, decimales: 0, unidad: '%', nota: 'del volumen del tambor' },
    rowland: { etiqueta: 'Correcciones de Bond', tipo: 'opciones', opciones: [{ valor: true, texto: 'Aplicadas' }, { valor: false, texto: 'Sin corregir' }], nota: 'tabla 7.1, en el molino de bolas' },
    Tamb: { etiqueta: 'Temperatura ambiente', min: 5, max: 40, paso: 1, decimales: 0, unidad: '°C' },
    series: { etiqueta: 'Serie de tamices', tipo: 'opciones', opciones: [{ valor: 'astm', texto: 'ASTM E11' }, { valor: 'tyler', texto: 'Tyler' }], nota: 'la ASTM E11 es la de la ISO 3310' }
  };

  /* ================= Las configuraciones ================= */
  var CARB = { mat: 'caliza', hum: 0, modo: 'seca', lC: log(5), rowland: true };   // el libro no le pone agua al carbonato
  function energia(r) { return un(r.Eeq, r.Eeq < 10 ? 3 : 1, 'kWh/t') + ', ' + un(r.Peje, r.Peje < 10 ? 2 : r.Peje < 100 ? 1 : 0, 'kW') + ' en el eje y un motor de ' + kwMot(r.motor) + '.'; }
  var CONFIGURACIONES = [
    { id: 'caso', ceja: 'Planta de aceite esencial', titulo: 'La cáscara del proyecto', cambios: {}, alerta: function (r) { return r.crit; },
      fija: 'La cáscara cítrica húmeda que sale de la juguera, en el molino de cuchillas: entra con 50 mm y sale con 7,9 mm, 2 t/h de sólido seco.',
      resultado: function (r) { return energia(r) + ' Sale a ' + un(r.Tout, 0, '°C') + '.'; } },
    { id: 'etapa1', ceja: 'Ejemplo 7.1 del libro', titulo: 'Carbonato, etapa 1', alerta: function (r) { return r.crit; },
      cambios: Object.assign({}, CARB, { mill: 'mand', lF: log(200000), lP: log(40000) }),
      fija: 'La caliza seca de la cantera en la trituradora de mandíbulas: entra con 200 mm y sale con 40 mm, 5 t/h.',
      resultado: function (r) { return energia(r) + ' La abertura del lado abierto es de ' + un(r.oss * 25.4, 0, 'mm') + '.'; } },
    { id: 'etapa2', ceja: 'Ejemplo 7.1 del libro', titulo: 'Carbonato, etapa 2', alerta: function (r) { return r.crit; },
      cambios: Object.assign({}, CARB, { mill: 'mart', lF: log(40000), lP: log(3000) }),
      fija: 'La piedra de 40 mm en el molino de martillos, hasta 3 mm, 5 t/h.',
      resultado: function (r) { return energia(r) + ' El libro la toma como una primera estimación.'; } },
    { id: 'etapa3', ceja: 'Ejemplos 7.1 y 7.2 del libro', titulo: 'Carbonato, etapa 3', alerta: function (r) { return r.crit; },
      cambios: Object.assign({}, CARB, { mill: 'bolas', lF: log(3000), lP: log(34.907), D: 2.0, J: 40, phi: 75 }),
      fija: 'El molino de bolas en seco, de 2,0 m, con 40 % de carga a 75 % de la crítica: entra con 3 mm y sale con el P₈₀ que da el circuito del libro, 34,9 µm, 5 t/h.',
      resultado: function (r) { return energia(r) + ' Gira a ' + un(r.ball.N, 1, 'r/min') + ' con ' + un(r.ball.mb, 1, 't') + ' de bolas, en un tambor de ' + un(r.ball.L, 2, 'm') + ' de largo.'; } }
  ];

  /* ================= Las máquinas en isométrico y en corte ================= */
  var FIGCAP = {
    cuch: 'Molino de cuchillas con la tapa de adelante quitada. La carcasa, la criba y la transmisión son las del molino de martillos; el rotor es un tambor con tres cuchillas que pasan rozando dos cuchillas fijas de la carcasa. El material entra por el chute de arriba y sale por la criba de abajo hacia la tolva de descarga.',
    bolas: 'Molino de bolas de 3 m con la mitad del tambor que mira al lector quitada entre dos planos: en la artesa de atrás giran los levantadores con la carga de la simulación a lo largo de todo el tambor, y en el corte del lado de la descarga se ve la sección entera de la carga. La corona y el piñón mueven el tambor; el mineral entra por el muñón de la izquierda y sale por el trommel de la derecha.',
    mand: 'Trituradora de mandíbulas de un solo toggle con la placa lateral de adelante quitada. El eje excéntrico, arriba, mueve la biela; el toggle la empuja abajo contra la mandíbula fija y la varilla con su resorte la devuelve. Las rocas de la simulación van en el plano del corte.',
    rod: 'Molino de rodillos dobles con la tapa lateral de adelante quitada. El rodillo de la derecha es flotante: sus chumaceras se apoyan en resortes que ceden si entra algo que no se rompe. Cada rodillo lleva su polea, sus correas y su motor.',
    mart: 'Molino de martillos con la tapa de adelante quitada. El rotor en voladizo gira con sus cuatro filas de martillos; el material entra por el chute de arriba y sale por la criba perforada de abajo hacia la tolva de descarga.',
    disc: 'Molino de discos de un solo rotor, con la mitad de abajo de la puerta y del disco fijo quitada entre el cubo y el anillo de los pernos. El material baja de la tolva por el tubo que entra al ojo del disco fijo, avanza en espiral por la luz entre los dos discos y sale por la periferia a la carcasa, que lo descarga por abajo al recipiente. La puerta va sostenida por cuatro varillas con resortes: ceden si entra algo que no se rompe, y con sus tuercas se ajusta la luz. El rotor dibujado gira unas diez veces más despacio que uno real, que gira entre 350 y 700 r/min según McCabe.'
  };
  var REGIMEN = { 'Deslizamiento': 'la carga apenas se levanta y resbala contra la pared: casi no hay molienda.', 'Cascada': 'las bolas ruedan sobre la superficie de la carga: molienda fina por frotación, con poco impacto.', 'Catarata': 'las bolas se despegan en el hombro y caen sobre el pie de la carga: el régimen de impacto que se busca en la operación normal.', 'Catarata intensa': 'las bolas vuelan por encima de la carga y golpean el revestimiento: más desgaste que molienda.', 'Centrifugado': 'la fuerza centrífuga supera al peso y la carga gira pegada a la pared: no hay molienda.' };
  function bolasEnSeccion(J) { return Math.round(0.8 * J / 100 * 3364 / 50) * 50; }
  var SIMCAP = {
    cuch: function () { return 'Las cuchillas del rotor pasan rozando las cuchillas fijas de la carcasa y cortan el material como unas tijeras. No hace falta que la partícula se fracture, y por eso este equipo sirve para la cáscara húmeda y fibrosa, que en un molino de impacto solo se aplasta. Sale lo que pasa por la criba de abajo, cuya abertura fija el tamaño. La simulación usa la mecánica de partículas del molino de martillos con el rotor de cuchillas.'; },
    bolas: function (r) { var b = r.ball; return 'Es una simulación de elementos discretos: unas ' + num(bolasEnSeccion(b.J), 0) + ' bolas de acero de entre 4 y 6 cm, de 5 cm en promedio, y granos de mineral en una sección del tambor con sus levantadores, girando a φ = ' + un(b.phi, 0, '%') + ' de la crítica. En ' + b.reg.toLowerCase() + ', ' + REGIMEN[b.reg] + ' Los destellos son impactos de bola contra mineral; el mineral se fractura con impactos repetidos y los finos se descargan. Como el régimen depende solo de ω²R/g, la simulación es dinámicamente semejante al molino real aunque su escala sea otra.'; },

        { etiqueta: 'En el fondo', valor: num(r.fondo, 1), unidad: '%', nota: 'lo que pasa por el tamiz más fino', alerta: r.fondo > 5 }
      ];
    },
    veredicto: function (r) {
      var big = r.rows.reduce(function (a, b) { return b.ret > a.ret ? b : a; }, r.rows[0]);
      if (r.fondo > 5) return { alerta: true, html: 'El fondo recibe el <b>' + num(r.fondo, 1) + NB + '%</b>: la serie no tiene tamices más finos para este producto.' };
      return { alerta: false, html: 'La pila de ' + r.rows.length + ' tamices retiene más en el ' + esc(big.m) + ', <b>' + num(big.ret, 1) + NB + '%</b>, y deja ' + num(r.fondo, 1) + NB + '% en el fondo.' };
    },
    prediccion: {
      base: { lP: log(8000) }, llevar: { lP: log(4000) },
      pregunta: function (rb) { return 'Con el producto objetivo en 8 mm, el fondo recibe el ' + num(rb.fondo, 1) + ' %. Si el objetivo baja a 4 mm, ¿cuánto recibe el fondo?'; },
      opciones: ['Bastante más', 'Más o menos lo mismo', 'Bastante menos'],
      instruccion: 'Lleve el producto objetivo a 4 mm y mire el número de la derecha.',
      cumple: function (st) { return Math.abs(st.lP - log(4000)) < 0.006; },
      correcta: function (rn, rb) { var d = rn.fondo - rb.fondo; return d > 1 ? 0 : d < -1 ? 2 : 1; },
      explica: function (rn, rb) { if (Math.abs(rn.P80 - rb.P80) < 1e-6) return 'La máquina no llega a ninguno de los dos objetivos y entrega ' + tam(rn.P80) + ' en los dos casos: el fondo se queda en ' + num(rn.fondo, 1) + ' %. Con otra máquina, la pila se corre con el producto.'; return 'El fondo recibe el ' + num(rn.fondo, 1) + ' %, contra ' + num(rb.fondo, 1) + ' % con 8 mm. La pila se escoge con el producto: con 4 mm entran tamices más finos y salen los gruesos que ya no retienen nada, así que el fondo sigue recibiendo poco. Lo que se corre es la pila: arriba queda el ' + esc(rn.rows[0].m) + ', donde antes estaba el ' + esc(rb.rows[0].m) + '.'; }
    },
    figuras: [TAMIZADORA],
    calculo: function (r) {
      return {
        intro: 'La tamizadora separa una muestra del producto en los tamices de la tabla. Cada partícula se saca al azar de la distribución calculada, y con muchas partículas lo retenido en cada tamiz se acerca al de la tabla.',
        pasos: [
          { titulo: 'La pila',
            texto: 'Los tamices son de una sola serie y la pila se escoge con el producto: arriba, el primero que ya retiene algo; abajo, el que deja pasar casi nada. Así casi nada queda sobre el más grueso ni pasa por el más fino.',
            res: 'Su pila: ' + r.rows.length + ' tamices de la serie ' + esc(r.series.name) + ', del ' + esc(r.rows[0].m) + ' arriba al ' + esc(r.rows[r.rows.length - 1].m) + ' abajo, con ' + num(r.fondo, 1) + ' % en el fondo.',
            libro: ['tamizado-y-analisis-granulometrico.html#sec-tam-analisis', 'Libro, sección 6.3'] },
          { titulo: 'La muestra',
            texto: 'Cada partícula sale de la distribución despejada para el tamaño, con u un número al azar entre 0 y 1. La partícula queda en el primer tamiz cuya abertura es menor que ella; si ninguno la detiene, cae al fondo.',
            ec: 'x = x\'\\left[-\\ln(1 - u)\\right]^{1/n}',
            num: 'x\' = ' + kn(r.x63, 0) + '\\ \\mu\\mathrm{m} \\qquad n = ' + kn(r.n, 1),
            fuente: 'La muestra tiene 360 partículas; cada vez que se tamiza otra, salen otras.', libro: ['caracterizacion-de-solidos-particulados.html#eq-rrb-tamano', 'Libro, ecuación 5.4'] },
          { titulo: 'La tamizadora de golpeteo',
            texto: 'Los tamices son de 8 pulgadas y de media altura, sobre su fondo. Mientras dura el ensayo, el plato describe una órbita 278 veces por minuto y un martillo de 2,44 kg golpea el corcho de la tapa 150 veces por minuto, lo que hace saltar las partículas sobre las mallas; el temporizador cuenta los 10 minutos del ensayo. La trama de las mallas y el tamaño de los granos van en escala logarítmica, porque entre la abertura más fina, de 38 µm, y las más gruesas, de varios centímetros, hay más de tres órdenes de magnitud.',
            libro: ['tamizado-y-analisis-granulometrico.html#fig-tam-tamizadora', 'Libro, figura 6.2'] }
        ],
        libro: [['tamizado-y-analisis-granulometrico.html#sec-tam-analisis', 'Sección 6.3, El análisis paso a paso'], ['tamizado-y-analisis-granulometrico.html#fig-tam-tamizadora', 'Figura 6.2, la tamizadora de golpeteo']]
      };
    }
  };

  /* ================= Botones propios de las notas de la escena ================= */
  document.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-ml-bolas]')) window.Explorador.cambiar('mill', 'bolas');
    else if (ev.target.closest('[data-ml-cfg]')) window.Explorador.abrirCfg();
  });

  /* ================= El explorador ================= */
  XL.explorador({
    id: 'molienda',
    nombre: 'Explorador de molienda y tamizado',
    capitulo: '7',
    curso: 'POU · 2027-10',
    modelo: { caso: M.CASO, calcular: M.calcular, ajustar: M.ajustar },
    libro: { pie: 'El modelo es el de los capítulos 6 y 7 del libro.', enlaces: [['reduccion-de-tamano.html', 'Capítulo 7'], ['tamizado-y-analisis-granulometrico.html', 'Capítulo 6']] },
    limpiar: ['pou-molienda:'],
    textos: { configuraciones: 'Al cargar una, el sistema vuelve al caso del curso con los cambios de la tarjeta. Los resultados de cada tarjeta salen del mismo modelo.' },
    controles: CONTROLES,
    configuraciones: CONFIGURACIONES,
    partes: [
      { titulo: 'La máquina', escenas: [MAQUINA, SELECCION, BOLAS] },
      { titulo: 'La energía', escenas: [BOND, MOTOR, CALOR] },
      { titulo: 'El producto', escenas: [DISTRIBUCION, TAMIZ] }
    ]
  });
})();
