<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Explorador de intercambiadores · Proyecto de Operaciones Unitarias</title>
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/zyg3ceo.css">
<link rel="stylesheet" href="/classroom/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/classroom/explorador-libro.css">
<style>
/* Solo lo propio de este explorador: los botones de a varios en rejilla, la leyenda de temperatura de las isométricas,
   las tablas y el diagnóstico de las figuras en HTML, la imagen del tren y el riel de escenas en el celular, que aquí
   tiene cinco partes. */
.xl-seg.rej { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 1.5px; background: var(--navy); }
.xl-seg.rej button { border-left: 0; min-width: 0; padding: 0 4px; }
.xl-c[hidden] { display: none !important; }

/* las isométricas: fondo blanco y la leyenda del color de la temperatura */
.xl-iso.iso[data-theme="light"] { --anatomy-paper: #fff; --anatomy-card: #fff; }
.hx-ley { position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px; padding: 3px 8px; background: rgba(255, 255, 255, .88); color: var(--sec); font-size: var(--t-xs); line-height: 1.3; pointer-events: none; }
.hx-ley i { display: block; width: 84px; height: 9px; background: linear-gradient(90deg, rgb(47, 109, 181), rgb(111, 168, 220), rgb(233, 227, 211), rgb(236, 154, 96), rgb(200, 69, 43)); }
.hx-ley em { font-style: normal; }

/* las figuras en HTML: fichas, tablas, listas y el diagnóstico */
.xl-html { padding: 12px 16px 16px; font-size: var(--t-s); line-height: 1.4; }
.tb-t { margin: 14px 0 6px; font-size: var(--t-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--oliva-osc); }
.tb-t:first-child { margin-top: 0; }
.tb-nota { margin: 10px 0 0; font-size: var(--t-xs); line-height: 1.45; color: var(--sec); }
.tb-f { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 0; margin: 0; }
.tb-f dt, .tb-f dd { margin: 0; padding: 5px 0; border-bottom: 1px solid var(--zona); font-size: var(--t-xs); }
.tb-f dt { color: var(--sec); padding-right: 10px; }
.tb-f dd { font-weight: 600; overflow-wrap: anywhere; }
table.tb { width: 100%; border-collapse: collapse; font-size: var(--t-xs); }
table.tb th, table.tb td { padding: 5px 6px; border-bottom: 1px solid var(--zona); text-align: right; white-space: nowrap; }
table.tb thead th { color: var(--oliva-osc); font-weight: 600; border-bottom: 1.5px solid var(--navy); white-space: normal; vertical-align: bottom; }
table.tb th[scope="row"], table.tb thead th:first-child { text-align: left; font-weight: 400; color: var(--sec); white-space: normal; }
table.tb tr.esc td, table.tb tr.esc th { background: var(--amarillo-claro); font-weight: 600; }
.al { color: var(--alerta); font-weight: 600; }
.tb-alt, .tb-mat, .dg-c, .dg-n { list-style: none; margin: 0; padding: 0; }
.tb-alt li, .tb-mat li { display: grid; gap: 2px; padding: 7px 0; border-bottom: 1px solid var(--zona); font-size: var(--t-xs); }
.tb-alt b, .tb-mat b { font-size: var(--t-s); }
.tb-mat li.cur { background: var(--amarillo-claro); padding-left: 8px; padding-right: 8px; }
.tb-mat em { font-style: normal; font-weight: 600; }
.dg-t { margin: 0 0 6px; font-size: var(--t-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--oliva-osc); }
.dg-n + .dg-t, .dg-c + .dg-t { margin-top: 14px; }
.dg-c li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--zona); font-size: var(--t-xs); }
.dg-c .n small { display: block; color: var(--sec); font-size: var(--t-xs); }
.dg-c .v { font-weight: 600; text-align: right; }
.dg-c .i, .dg-n .i { display: grid; place-items: center; align-self: start; }
.dg-c .i .xl-ico, .dg-n .i .xl-ico { width: 16px; height: 16px; }
.dg-c .w .i, .dg-n .w .i { color: #C2410C; }
.dg-c .c .i, .dg-c .c .v, .dg-n .c .i { color: var(--alerta); }
.dg-c .na { color: var(--guia); }
.dg-c .ok .i, .dg-n .ok .i { color: var(--oliva); }
.dg-n li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 6px 0; font-size: var(--t-xs); line-height: 1.45; }

/* la imagen del tren de condensación del capítulo 23 */
.cd-img { margin: 0; display: flex; flex-direction: column; gap: 8px; height: 100%; }
.cd-img a { display: flex; flex: 1 1 auto; min-height: 0; }
.cd-img img { display: block; width: 100%; height: auto; min-height: 0; flex: 1 1 auto; object-fit: contain; }
.cd-img figcaption { flex: none; font-size: var(--t-xs); line-height: 1.4; color: var(--sec); }

/* el celular: las escenas de las cinco partes en una sola fila que se desliza, con el nombre de cada parte */
@media (max-width: 1099.98px), (max-height: 599.98px) {
  .xl-riel { display: flex; flex-direction: row; align-items: stretch; gap: 12px; overflow-x: auto; scrollbar-width: thin; }
  .xl-riel .xl-parte { flex: none; }
  .xl-riel .xl-parte-t { display: flex; align-items: center; padding: 0 2px 0 0; font-size: var(--t-xs); letter-spacing: .06em; white-space: nowrap; }
  .xl-riel .xl-sn { flex: none; width: auto; padding: 6px 12px; white-space: nowrap; }
  .xl-capa-riel { display: flex; flex-direction: row; gap: 12px; overflow-x: auto; }
  .xl-capa-riel .xl-parte { flex: none; width: auto; }
  .xl-capa-riel .xl-sn { flex: none; width: auto; padding: 6px 12px; white-space: nowrap; }
  .cd-img { height: auto; }
}

/* «¿Cómo se calcula?»: el riel tiene treinta escenas, así que los datos de la escena van arriba, a la vista */
@media (min-width: 1100px) and (min-height: 600px) {
  .xl-capa-lado { display: flex; flex-direction: column; }
  .xl-capa-lado .xl-datos { order: -1; margin: 0 0 14px; }
  .xl-capa-lado .xl-datos[hidden] { display: none; }
}

/* Las isométricas de los cuatro equipos (scripts/figuras/intercambiador, placas, doble-tubo y aeroenfriador). */
/*HXFIG_CSS_START*/
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

/* el intercambiador: interior del corte, cara cortada y lo vivo */
.hx-cav{--anatomy-paper:#d9dde1;--anatomy-face:#d9dde1;--anatomy-top:#e4e7ea;--anatomy-shade-0:#b9bfc5;--anatomy-shade-1:#c3c9ce;--anatomy-shade-2:#cdd2d6;--anatomy-shade-3:#d6dade}
.hx-cutface{--anatomy-paper:#c9ced3;--anatomy-top:#c9ced3;--anatomy-face:#c9ced3;--anatomy-shade-0:#c9ced3;--anatomy-shade-1:#c9ced3;--anatomy-shade-2:#c9ced3;--anatomy-shade-3:#c9ced3}
.hx-items [data-live]{pointer-events:none}
/* lo vivo: tubos (contorno, color de su temperatura y brillo), trazos de flujo, particiones y lado coraza */
.hx-tbo{fill:none;stroke:var(--anatomy-ink,#2b2b2b);stroke-opacity:.3;stroke-linecap:butt}
.hx-tb{fill:none;stroke-linecap:butt}
.hx-tbs{fill:none;stroke:#fff;stroke-opacity:.38;stroke-linecap:butt;transform:translate(0,-.35px)}
.hx-u{stroke-linecap:round}
.hx-flow{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:.5px;stroke-dasharray:1.4 7;stroke-dashoffset:calc(var(--hx-flow,0) * 1px);stroke-linecap:round}
.hx-plate{fill:#e7e9ec;stroke:var(--anatomy-ink,#2b2b2b);stroke-width:.32px;stroke-linejoin:round}
.hx-plate-e{fill:#c9ced3;stroke:var(--anatomy-ink,#2b2b2b);stroke-width:.32px;stroke-linejoin:round}
.hx-sp{stroke:var(--anatomy-ink,#2b2b2b);stroke-width:.18px;stroke-opacity:.6}
.hx-drop{stroke-opacity:.45}
.hx-tint{opacity:.34;pointer-events:none}
.hx-tint.hx-steam{opacity:.22}
/*HXFIG_CSS_END*/
/*PLFIG_CSS_START*/
/* el intercambiador de placas: placas en corte, empaques, bastidor y lo vivo */
.pl-items .pl-gasket{--anatomy-paper:#3b3f44;--anatomy-face:#3b3f44;--anatomy-top:#4a4f55;--anatomy-shade-0:#2f3236;--anatomy-shade-1:#34383c;--anatomy-shade-2:#383c41;--anatomy-shade-3:#3b3f44}
.pl-items .pl-frame{--anatomy-paper:#e3e6e9;--anatomy-face:#e3e6e9;--anatomy-top:#eef0f2;--anatomy-shade-0:#c5cbd1;--anatomy-shade-1:#cfd4d9;--anatomy-shade-2:#d8dce0;--anatomy-shade-3:#dfe2e5}
.pl-items [data-live]{pointer-events:none}
.pl-fl{stroke:none;opacity:.92}
.pl-fl.pl-steam{opacity:.55}
.pl-dot{stroke:var(--anatomy-ink,#2b2b2b);stroke-width:.12px;stroke-opacity:.55}
.pl-drop{fill:#5b8fc9;stroke:#2b4f7a;stroke-width:.1px;opacity:.85}
.pl-items .pl-plate{--anatomy-paper:#c3c9cf;--anatomy-face:#c3c9cf;--anatomy-top:#d4d8dc;--anatomy-shade-0:#a9b0b7;--anatomy-shade-1:#b1b8be;--anatomy-shade-2:#b9bfc5;--anatomy-shade-3:#c0c6cc}
/*PLFIG_CSS_END*/
/*DPFIG_CSS_START*/
/* el doble tubo: interior del corte, cara cortada, fundición del cabezal de retorno y lo vivo */
.hx-cav{--anatomy-paper:#d9dde1;--anatomy-face:#d9dde1;--anatomy-top:#e4e7ea;--anatomy-shade-0:#b9bfc5;--anatomy-shade-1:#c3c9ce;--anatomy-shade-2:#cdd2d6;--anatomy-shade-3:#d6dade}
.hx-cutface{--anatomy-paper:#c9ced3;--anatomy-top:#c9ced3;--anatomy-face:#c9ced3;--anatomy-shade-0:#c9ced3;--anatomy-shade-1:#c9ced3;--anatomy-shade-2:#c9ced3;--anatomy-shade-3:#c9ced3}
.dp-items .dp-cast{--anatomy-paper:#dcdfe2;--anatomy-face:#dcdfe2;--anatomy-top:#e7e9eb;--anatomy-shade-0:#bec3c8;--anatomy-shade-1:#c7ccd0;--anatomy-shade-2:#d0d4d8;--anatomy-shade-3:#d7dade}
.dp-items [data-live]{pointer-events:none}
/* el tubo interior: color de su temperatura, sombra abajo y brillo arriba, trazos de flujo */
.dp-tb{fill:none;stroke-linecap:butt}
.dp-tbe{stroke:none}
.dp-tbd{fill:none;stroke:#000;stroke-opacity:.13;stroke-linecap:butt}
.dp-tbs{fill:none;stroke:#fff;stroke-opacity:.42;stroke-linecap:butt}
.dp-flow{fill:none;stroke:#fff;stroke-opacity:.9;stroke-width:.6px;stroke-linecap:round}
/* el ánulo: velo sobre la pared interior del tubo exterior, puntos y condensado */
.dp-tint{opacity:.5}
.dp-tint.dp-steam{opacity:.22}
.dp-dot{stroke:var(--anatomy-ink,#2b2b2b);stroke-width:.14px;stroke-opacity:.5}
.dp-drop{fill:#5b8fc9;stroke:#2b4f7a;stroke-width:.12px;opacity:.85}
.dp-film{fill:#5b8fc9;opacity:.55}
/*DPFIG_CSS_END*/
/*ACFIG_CSS_START*/
/* el aeroenfriador: chapa de la cámara, cabezales y lo vivo */
.ac-items .ac-sheet{--anatomy-paper:#e3e6e9;--anatomy-face:#e3e6e9;--anatomy-top:#eceef0;--anatomy-shade-0:#c6cbd0;--anatomy-shade-1:#cfd3d7;--anatomy-shade-2:#d7dadd;--anatomy-shade-3:#dde0e3}
.ac-items .ac-hdr{--anatomy-paper:#dcdfe2;--anatomy-face:#dcdfe2;--anatomy-top:#e7e9eb;--anatomy-shade-0:#bec3c8;--anatomy-shade-1:#c7ccd0;--anatomy-shade-2:#d0d4d8;--anatomy-shade-3:#d7dade}
.ac-items [data-live]{pointer-events:none}
/* los tubos aleteados: contorno, aletas con la temperatura del proceso, rayado de las aletas y brillo */
.ac-to{fill:none;stroke:var(--anatomy-ink,#2b2b2b);stroke-opacity:.42;stroke-linecap:butt}
.ac-tf{fill:none;stroke-linecap:butt}

if (window.MutationObserver) new MutationObserver(enfocarRiel).observe(document.getElementById('riel'), { subtree: true, attributes: true, attributeFilter: ['class'] });

// al cargar una tarjeta, el explorador abre en la parte de su equipo (el armazón ya la cargó y cerró la ventana)
var PRIMERA = {};
Explorador.escenas.forEach(function (e, i) { if (PRIMERA[e._eq] == null) PRIMERA[e._eq] = i; });
document.getElementById('cfgs').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-cfg]'); if (!b) return;
  var c = CONFIGS.filter(function (x) { return x.id === b.dataset.cfg; })[0];
  if (!c || !c._eq) return;
  if (Explorador.escenas[Explorador.escena()]._eq !== c._eq) Explorador.ir(PRIMERA[c._eq]);
});
})();
</script>
