<script id="modelo">
/* El modelo de la winterización: el del libro de operaciones unitarias (herramientas/filtros.py, sección 5, y el
   ejemplo 18.5 del capítulo 18). Los números por defecto son los del caso: 166 kg de aceite cada 8 h, enfriado a
   5 °C, 8 h de reposo y un filtro de placas de celulosa que pasa el lote en 2 h.
   El aceite es d-limoneno (Clará y coautores, 2009); el agua, IAPWS-95 a la presión de Bogotá (la tabla entre 0 y 40 °C
   que escribe filtros.py); el agua disuelta, el modelo de Li y Tamura en cinco puntos, interpolado en ln w contra 1/T;
   las placas, las hojas Seitz K y Seitz ZD de Pall. El agua libre (500 mg/kg) y lo que retiene la placa (100 g/m²)
   son ilustrativos en el libro. Este bloque no toca la página: la prueba de los números lo carga solo. */
window.Modelo = (function () {
  'use strict';
  var G = 9.80665, BAR = 1e5, PLACA = 0.4 * 0.4;
  // [T °C, ρ kg/m³, μ Pa·s] del agua líquida a 73,7 kPa
  var AGUA = [[0,999.8290,1.791818e-03],[1,999.8879,1.731078e-03],[2,999.9291,1.673567e-03],[3,999.9534,1.619056e-03],[4,999.9612,1.567335e-03],[5,999.9531,1.518212e-03],[6,999.9294,1.471513e-03],[7,999.8908,1.427076e-03],[8,999.8377,1.384754e-03],[9,999.7703,1.344412e-03],[10,999.6893,1.305925e-03],[11,999.5948,1.269177e-03],[12,999.4873,1.234064e-03],[13,999.3670,1.200486e-03],[14,999.2344,1.168354e-03],[15,999.0897,1.137583e-03],[16,998.9332,1.108095e-03],[17,998.7652,1.079818e-03],[18,998.5859,1.052685e-03],[19,998.3956,1.026633e-03],[20,998.1945,1.001605e-03],[21,997.9829,9.775446e-04],[22,997.7609,9.544026e-04],[23,997.5289,9.321313e-04],[24,997.2869,9.106864e-04],[25,997.0352,8.900263e-04],[26,996.7739,8.701124e-04],[27,996.5034,8.509082e-04],[28,996.2236,8.323796e-04],[29,995.9348,8.144943e-04],[30,995.6371,7.972224e-04],[31,995.3308,7.805353e-04],[32,995.0159,7.644064e-04],[33,994.6925,7.488104e-04],[34,994.3609,7.337237e-04],[35,994.0211,7.191238e-04],[36,993.6733,7.049896e-04],[37,993.3176,6.913011e-04],[38,992.9541,6.780393e-04],[39,992.5829,6.651863e-04],[40,992.2042,6.527253e-04]];
  var DISUELTA = [[5, 517], [10, 566], [20, 673], [25, 731], [35, 856]];   // mg de agua por kg de limoneno saturado
  var PALL = { 'K 900': 1700, 'K 250': 510, 'K 100': 146, 'EKS': 29 };     // L/(m²·min) de agua a 20 °C y 1 bar
  var ZD = { fino: 525, pulido: 850 };                                     // L/(m²·h), flujo recomendado
  var MU_W20 = AGUA[20][2];
  var CASO = {
    T: 5, Tllega: 20, kgh: 20.76244550342911, loteH: 8,                    // el enfriado y el lote
    reposo: 8, libre: 500, da: 2, db: 16.392631578041878, hd: 1,            // el reposo (db: la gota que deja el florentino)
    placas: 6, grado: 'K 250', cap: 100, tf: 2, dpAdm: 0.1                  // el filtro
  };

  function agua(tc) {
    var i = Math.max(0, Math.min(AGUA.length - 2, Math.floor(tc))), a = AGUA[i], b = AGUA[i + 1], t = tc - a[0];
    return { rho: a[1] + (b[1] - a[1]) * t, mu: Math.exp(Math.log(a[2]) + (Math.log(b[2]) - Math.log(a[2])) * t) };
  }
  function limoneno(tc) { var T = tc + 273.15; return { rho: 1077.4 - 0.793 * T, mu: 0.017e-3 * Math.exp(1173 / T) }; }
  function tramo(tc) {
    var xs = DISUELTA.map(function (p) { return 1 / (p[0] + 273.15); }), x = 1 / (tc + 273.15);
    var n = xs.filter(function (xx) { return xx > x; }).length;
    var i = Math.max(0, Math.min(xs.length - 2, n - 1)), f = (x - xs[i]) / (xs[i + 1] - xs[i]);
    return { i: i, f: f, T1: DISUELTA[i][0], T2: DISUELTA[i + 1][0], w1: DISUELTA[i][1], w2: DISUELTA[i + 1][1],
      w: Math.exp(Math.log(DISUELTA[i][1]) + f * (Math.log(DISUELTA[i + 1][1]) - Math.log(DISUELTA[i][1]))) };
  }
  function disuelta(tc) { return tramo(tc).w; }
  // Fracción del agua libre (repartida pareja en ln d entre da y db) que llega al fondo: cada tamaño cae en la
  // fracción min[1, (d/dc)²]; con dc infinito (sin reposo) no cae nada.
  function eta(da, db, dc) {
    if (!(db > da)) return 0;
    if (!isFinite(dc)) return 0;
    var L = Math.log(db / da), c = Math.min(db, dc);
    var parte = c > da ? (c * c - da * da) / (2 * dc * dc) : 0;
    var entera = db > dc ? Math.log(db / Math.max(dc, da)) : 0;
    return (parte + entera) / L;
  }

  function calcular(s) {
    var o = limoneno(s.T), w = agua(s.T), drho = w.rho - o.rho;
    var kg = s.kgh * s.loteH, V = kg / o.rho;                               // kg y m³ del lote
    var D = Math.pow(4 * V / (Math.PI * s.hd), 1 / 3), H = s.hd * D;
    var tr = s.reposo * 3600, da = s.da * 1e-6, db = s.db * 1e-6;
    function dcEn(h) { return h > 0 ? Math.sqrt(18 * o.mu * H / (G * drho * h * 3600)) : Infinity; }
    var dc = dcEn(s.reposo), et = eta(da, db, dc);
    var wLl = disuelta(s.Tllega), wT = disuelta(s.T);
    var sale = Math.max(0, wLl - wT), queda = Math.min(wT, wLl);
    var purga = s.libre * et, libreFiltro = s.libre - purga;
    var mgkg = libreFiltro + sale, g = mgkg * kg / 1000;
    var Q = V / (s.tf * 3600);
    var Rm = BAR / (MU_W20 * PALL[s.grado] / 60000);
    var A1 = o.mu * Rm * Q / (s.dpAdm * BAR);
    var A2 = [Q * 3.6e6 / ZD.pulido, Q * 3.6e6 / ZD.fino];
    var A3 = g / s.cap;
    var crit = [['caida', A1], ['flujo', A2[1]], ['agua', A3]].sort(function (a, b) { return b[1] - a[1]; });
    var Amax = crit[0][1];
    var A = s.placas * PLACA;
    return {
      s: s, o: o, w: w, drho: drho, kg: kg, V: V, D: D, H: H, tr: tr, da: da, db: db, dc: dc, eta: et,
      wLl: wLl, wT: wT, sale: sale, queda: queda, fracQueda: queda / wLl, gSale: sale * kg / 1000,
      muLl: limoneno(s.Tllega).mu,
      libre: s.libre, purga: purga, libreFiltro: libreFiltro, gPurga: purga * kg / 1000,
      mgkg: mgkg, g: g, Q: Q, Rm: Rm, A1: A1, A2: A2, A3: A3, Amax: Amax, decide: crit[0][0],
      nAgua: Math.ceil(A3 / PLACA - 1e-9), nReq: Math.ceil(Amax / PLACA - 1e-9),
      A: A, carga: g / (s.cap * A), dp: o.mu * Rm * Q / A / BAR,
      residuo: [0.0008 * kg, 0.014 * kg],
      v: function (d) { return G * drho * d * d / (18 * o.mu); },
      re: function (d) { return o.rho * (G * drho * d * d / (18 * o.mu)) * d / o.mu; },
      dcEn: dcEn,
      etaEn: function (h) { return eta(da, db, dcEn(h)); }
    };
  }
  return { G: G, BAR: BAR, PLACA: PLACA, AGUA: AGUA, DISUELTA: DISUELTA, PALL: PALL, ZD: ZD, MU_W20: MU_W20, CASO: CASO,
    agua: agua, limoneno: limoneno, tramo: tramo, disuelta: disuelta, eta: eta, calcular: calcular };
})();
</script>

<script>
/* El explorador: el armazón (/classroom/explorador-libro.js) pone la página; aquí van los controles, las
   configuraciones y las tres escenas de la winterización, cada una con sus dos figuras en SVG. */
(function () {
  'use strict';
  var M = window.Modelo;
  var D = XL.dib, C = D.C, s = D.el, tx = D.texto, set = D.attrs, entre = D.entre, azar = D.azar, suave = D.suave, mezcla = D.mezcla;
  var num = XL.num, un = XL.un, pct = XL.pct, kn = XL.kn, kc = XL.kc, NB = XL.NB, reducido = XL.reducido;

  function mbar(bar) { var m = bar * 1000; return un(m, m < 3 ? 1 : 0, 'mbar'); }
  function placasTxt(n) { return n === 1 ? 'una placa' : n + NB + 'placas'; }
  function colorFrio(T) { return mezcla(C.agua, C.aguaO, entre((20 - T) / 20, 0, 1) * 0.85); }

  /* ================= Los controles: cada uno cambia solo su clave ================= */
  var CONTROLES = {
    T: { etiqueta: 'Temperatura del enfriado', min: 0, max: 20, paso: 0.5, decimales: 1, unidad: '°C' },
    Tllega: { etiqueta: 'Temperatura del aceite que llega', min: 15, max: 30, paso: 0.5, decimales: 1, unidad: '°C', nota: 'la del florentino' },
    kgh: { etiqueta: 'Aceite que llega por hora', min: 5, max: 40, paso: 0.1, decimales: 1, unidad: 'kg/h' },
    loteH: { etiqueta: 'Horas de aceite por lote', min: 4, max: 16, paso: 1, decimales: 0, unidad: 'h' },
    reposo: { etiqueta: 'Horas de reposo', min: 0, max: 24, paso: 0.5, decimales: 1, unidad: 'h' },
    libre: { etiqueta: 'Agua libre que trae el aceite', min: 0, max: 1000, paso: 10, decimales: 0, unidad: 'mg/kg', nota: 'ilustrativa' },
    db: { etiqueta: 'Gota más grande que deja el florentino', min: 6, max: 30, paso: 0.1, decimales: 1, unidad: 'µm' },
    da: { etiqueta: 'Gota más pequeña del agua libre', min: 0.5, max: 5, paso: 0.1, decimales: 1, unidad: 'µm' },
    hd: { etiqueta: 'Altura del líquido sobre el diámetro', min: 0.5, max: 2, paso: 0.05, decimales: 2 },
    placas: { etiqueta: 'Placas de 400 × 400 mm', tipo: 'contador', min: 1, max: 12, menos: 'Una placa menos', mas: 'Una placa más',
      formato: function (v) { return v + ' (' + un(v * M.PLACA, 2, 'm²') + ')'; }, salida: function (v) { return un(v * M.PLACA, 2, 'm²'); } },
    grado: { etiqueta: 'Grado de la placa', tipo: 'opciones', opciones: ['K 900', 'K 250', 'K 100', 'EKS'], nota: 'la más abierta a la izquierda' },
    cap: { etiqueta: 'Agua que retiene cada m² de placa', min: 50, max: 200, paso: 5, decimales: 0, unidad: 'g/m²', nota: 'ilustrativa' },
    tf: { etiqueta: 'Horas para pasar el lote', min: 1, max: 4, paso: 0.5, decimales: 1, unidad: 'h' },
    dpAdm: { etiqueta: 'Caída limpia admisible', min: 0.05, max: 0.5, paso: 0.05, decimales: 2, unidad: 'bar' }
  };

  /* ================= Las configuraciones ================= */
  function saturadas(r) { return r.carga > 1; }
  var CONFIGURACIONES = [
    { id: 'caso', ceja: 'Ejemplo 18.5 del libro', titulo: 'El caso del libro', cambios: {}, alerta: saturadas,
      fija: 'Enfriado a 5 °C, 8 h de reposo y seis placas K 250 que retienen 100 g/m² cada una.',
      resultado: function (r) { return un(r.g, 0, 'g') + ' de agua al filtro; las placas terminan al ' + pct(r.carga) + '.'; } },
    { id: 'sinreposo', ceja: 'Variante del caso', titulo: 'Sin reposo', cambios: { reposo: 0 }, alerta: saturadas,
      fija: 'Después del enfriado, el aceite va directo al filtro, sin reposar.',
      resultado: function (r) { return un(r.g, 0, 'g') + ' al filtro; ' + (r.carga > 1 ? 'las seis placas se saturan y hacen falta ' + r.nAgua + '.' : 'las placas terminan al ' + pct(r.carga) + '.'); } },
    { id: 'reposo16', ceja: 'Variante del caso', titulo: 'Reposo de 16 h', cambios: { reposo: 16 }, alerta: saturadas,
      fija: 'El reposo dura el doble: 16 h en lugar de 8.',
      resultado: function (r) { return un(r.g, 0, 'g') + ' al filtro; bastarían ' + placasTxt(r.nAgua) + '.'; } },
    { id: 'quince', ceja: 'Variante del caso', titulo: 'Enfriado a 15 °C', cambios: { T: 15 }, alerta: saturadas,
      fija: 'El lote se enfría solo hasta 15 °C, con el mismo reposo.',
      resultado: function (r) { return un(r.g, 0, 'g') + ' al filtro, pero el aceite se queda con ' + un(r.queda, 0, 'mg/kg') + ' de agua disuelta.'; } }
  ];

  /* ================= 1. El enfriado ================= */
  var ENFRIADO = (function () {
    var S = {};
    var X0 = 54, X1 = 384, Y0 = 40, Y1 = 232;
    function xT(T) { return X0 + T / 30 * (X1 - X0); }
    function yW(w) { return Y1 - (w - 400) / 400 * (Y1 - Y0); }
    function dibujarTanque(r) {
      var T = S.Tvis, Tl = r.s.Tllega;
      S.camisa.setAttribute('fill', colorFrio(Math.min(T, Tl)));
      S.lecT.textContent = un(T, 1, '°C');
      var maxS = Math.max(1, M.disuelta(Tl) - M.disuelta(0)), ahora = Math.max(0, M.disuelta(Tl) - M.disuelta(T));
      var f = ahora / maxS;
      S.puntos.forEach(function (p) { p.el.setAttribute('opacity', p.u <= f ? 1 : 0); });
      S.lupa.forEach(function (p) { p.el.setAttribute('opacity', p.u <= f ? 1 : 0); });
      S.estadoTx.textContent = S.anim ? 'enfriando…' : '';
    }
    function repetir(r) { S.Tvis = r.s.Tllega; S.anim = { desde: r.s.Tllega, hasta: r.s.T, t: 0, dur: 1.8 }; }

    var tanque = {
      titulo: 'El tanque TK‑201 A', ancha: true, tipo: 'svg', vista: [400, 400], repetirTexto: 'Repetir el enfriado',
      alt: 'El tanque de winterización TK-201 A en corte, con su camisa de glicol, el termómetro TT-201 y un círculo de detalle donde aparecen las gotas finas de agua que salen de solución a medida que el aceite se enfría.',
      montar: function (g) {
        var x0 = 80, x1 = 250, xm = 165, yl = 90, yb = 314;
        s('line', { x1: 222, y1: 6, x2: 222, y2: 52, stroke: C.aceiteO, 'stroke-width': 4 }, g);
        tx(g, 232, 20, 'de TK‑203', 'f-ts');
        S.camisa = s('path', { d: 'M68 110V314A97 28 0 0 0 262 314V110Z', fill: colorFrio(20), stroke: C.tinta, 'stroke-width': 1.4 }, g);
        s('path', { d: 'M' + x0 + ' ' + yl + 'V' + yb + 'A85 20 0 0 0 ' + x1 + ' ' + yb + 'V' + yl + 'Z', fill: C.aceite }, g);
        s('line', { x1: x0, y1: yl, x2: x1, y2: yl, stroke: C.aceiteO, 'stroke-width': 1.4 }, g);
        S.gotas = s('g', {}, g);
        s('path', { d: 'M' + x0 + ' 62V' + yb + 'A85 20 0 0 0 ' + x1 + ' ' + yb + 'V62', class: 'f-pared' }, g);
        s('path', { d: 'M' + x0 + ' 62A85 14 0 0 1 ' + x1 + ' 62', class: 'f-pared' }, g);
        tx(g, xm, 112, 'aceite del lote', 'f-ts f-halo', 'middle');
        // la purga
        s('line', { x1: xm, y1: 334, x2: xm, y2: 394, stroke: C.tinta, 'stroke-width': 1.6 }, g);
        D.valvula(g, xm, 366, false);
        tx(g, xm + 16, 371, 'purga', 'f-ts');
        // el glicol de la camisa
        D.flecha(g, 262, 124, 300, 124, C.tinta, 1.6); tx(g, 304, 129, 'glicol', 'f-ts');
        D.flecha(g, 300, 300, 262, 300, C.tinta, 1.6); tx(g, 304, 305, 'glicol', 'f-ts');
        tx(g, 34, 352, 'camisa', 'f-ts', 'middle');
        s('line', { x1: 36, y1: 338, x2: 66, y2: 312, stroke: C.guia, 'stroke-width': 1 }, g);
        // el termómetro
        s('line', { x1: 55, y1: 170, x2: 96, y2: 170, stroke: C.tinta, 'stroke-width': 1.4 }, g);
        D.burbuja(g, 36, 170, 'TT', '201');
        S.lecT = tx(g, 36, 216, '', 'f-vg', 'middle');
        // la lupa
        var lx = 326, ly = 182, lr = 48, cx = 222, cy = 236, cr = 8;
        D.tangentes(cx, cy, cr, lx, ly, lr).forEach(function (q) { s('line', { x1: q[0], y1: q[1], x2: q[2], y2: q[3], stroke: C.guia, 'stroke-width': 1 }, g); });
        s('circle', { cx: cx, cy: cy, r: cr, fill: 'none', stroke: C.tinta, 'stroke-width': 1.2 }, g);
        var clip = s('clipPath', { id: 'lupa1' }, s('defs', {}, g));
        s('circle', { cx: lx, cy: ly, r: lr }, clip);
        s('circle', { cx: lx, cy: ly, r: lr, fill: C.aceite }, g);
        S.gLupa = s('g', { 'clip-path': 'url(#lupa1)' }, g);
        s('circle', { cx: lx, cy: ly, r: lr, fill: 'none', stroke: C.tinta, 'stroke-width': 1.6 }, g);
        tx(g, lx, 250, 'gotas que salen', 'f-ts', 'middle');
        tx(g, lx, 266, 'de solución,', 'f-ts', 'middle');
        tx(g, lx, 282, 'aumentadas', 'f-ts', 'middle');
        S.estadoTx = tx(g, 36, 236, '', 'f-ts', 'middle');
        // las gotas, cada una con el agua que tiene que salir para que aparezca
        var rnd = azar(11);
        S.puntos = []; S.lupa = [];
        for (var i = 0; i < 160; i++) {
          var px = x0 + 7 + rnd() * (x1 - x0 - 14), py = yl + 8 + rnd() * (yb - yl - 12);
          S.puntos.push({ u: (i + rnd()) / 160, el: s('circle', { cx: px.toFixed(1), cy: py.toFixed(1), r: 1.5, fill: C.azul, opacity: 0 }, S.gotas) });
        }
        for (i = 0; i < 36; i++) {
          var ang = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * (lr - 6);
          S.lupa.push({ u: (i + rnd()) / 36, el: s('circle', { cx: (lx + rr * Math.cos(ang)).toFixed(1), cy: (ly + rr * Math.sin(ang)).toFixed(1), r: (2 + rnd() * 2.4).toFixed(1), fill: C.aguaO, stroke: C.azul, 'stroke-width': 0.8, opacity: 0 }, S.gLupa) });
        }
        S.Tvis = M.CASO.Tllega; S.anim = null;
      },
      // el tanque sigue a la temperatura que se anima: al entrar, el enfriado completo; con un cambio, el tramo
      poner: function (r, modo) {
        var T = r.s.T;
        if (modo === 'entrar' && !reducido()) { repetir(r); dibujarTanque(r); }
        else if (modo !== 'cambio' || reducido()) { S.anim = null; S.Tvis = T; dibujarTanque(r); }
        else S.anim = { desde: S.Tvis, hasta: T, t: 0, dur: Math.min(1.6, 0.35 + Math.abs(S.Tvis - T) * 0.08) };
      },
      repetir: function (r) { repetir(r); },
      cuadro: function (dt, r) {
        if (!S.anim) return;
        S.anim.t += dt;
        var f = suave(S.anim.t / S.anim.dur);
        S.Tvis = S.anim.desde + (S.anim.hasta - S.anim.desde) * f;
        if (S.anim.t >= S.anim.dur) { S.Tvis = S.anim.hasta; S.anim = null; }
        dibujarTanque(r);
      }
    };

    var curva = {
      titulo: 'El agua disuelta', tipo: 'svg', vista: [400, 400],
      alt: 'Gráfica del agua disuelta en el aceite contra la temperatura, con el punto del aceite que llega del florentino, el punto después del enfriado y la diferencia que sale de solución; abajo, una barra con el agua disuelta al llegar partida en la que sale y la que se queda.',
      montar: function (g) {
        tx(g, X0, 24, 'agua disuelta en el aceite, mg/kg', 'f-t');
        S.hielo = s('rect', { x: xT(0), y: Y0, width: xT(3) - xT(0), height: Y1 - Y0, fill: C.fuera }, g);
        tx(g, xT(3) + 6, Y0 + 16, 'riesgo de hielo', 'f-ts f-halo');
        for (var T = 0; T <= 30; T += 5) { s('line', { x1: xT(T), x2: xT(T), y1: Y0, y2: Y1, class: 'f-rej' }, g); tx(g, xT(T), Y1 + 18, String(T), 'f-ts', 'middle'); }
        for (var w = 400; w <= 800; w += 100) { s('line', { x1: X0, x2: X1, y1: yW(w), y2: yW(w), class: 'f-rej' }, g); tx(g, X0 - 6, yW(w) + 4, String(w), 'f-ts', 'end'); }

          { lb: 'Caída limpia de ' + un(r.s.dpAdm * 1000, 0, 'mbar'), sub: 'placa ' + r.s.grado + ', ' + un(M.PALL[r.s.grado], 0, 'L/(m²·min)') + ' de agua', A: r.A1, k: 'caida' },
          { lb: 'Flujo recomendado', sub: 'entre 525 y 850 L/(m²·h)', A: r.A2[1], A0: r.A2[0], k: 'flujo' },
          { lb: 'Agua retenida', sub: un(r.s.cap, 0, 'g/m²') + ', ilustrativo; ' + un(r.g, 0, 'g') + ' por lote', A: r.A3, k: 'agua' }
        ];
        datos.forEach(function (d, j) {
          var f = S.filas[j], ok = r.A >= d.A - 1e-12, decide = r.decide === d.k;
          f.lb.textContent = d.lb + (decide ? ' · decide' : '');
          f.sub.textContent = d.sub;
          f.est.textContent = ok ? 'cumple' : 'falta área';
          f.est.setAttribute('class', 'f-v' + (ok ? '' : ' f-alerta'));
          if (d.A0) set(f.bar, { x: xa(d.A0), width: Math.max(2, xa(d.A) - xa(d.A0)), opacity: 1 }); else set(f.bar, { opacity: 0 });
          set(f.pt, { cx: xa(d.A), fill: ok ? (decide ? C.tinta : C.blanco) : C.alerta, stroke: ok ? C.tinta : C.alerta });
        });
        var xs = xa(r.A);
        set(S.selBanda, { x: xs - 5 }); set(S.selLinea, { x1: xs, x2: xs });
        set(S.lbSel, { x: entre(xs, BX0 + 80, BX1 - 80) });
        S.lbSel.textContent = 'sus placas: ' + un(r.A, 2, 'm²');
        dibujarAvance(r);
      }
    };

    return {
      id: 'filtro', titulo: 'El filtro de placas', corto: 'Filtro',
      pregunta: '¿Cuánta placa pide el lote, y qué criterio decide el área?',
      controles: ['placas', 'grado', 'cap'], mas: ['tf', 'dpAdm'], datos: ['placas', 'grado', 'cap'],
      info: function (r) { return 'Llegan del reposo <b>' + un(r.libreFiltro, 0, 'mg/kg') + '</b> de agua libre y del enfriado ' + un(r.sale, 0, 'mg/kg') + ' que salieron de solución. <button type="button" data-ir="reposo">Cambiar en El reposo</button>'; },
      kpis: function (r) {
        return [
          { etiqueta: 'Agua al filtro', valor: num(r.g, 0), unidad: 'g', nota: un(r.mgkg, 0, 'mg/kg') + ' en ' + un(r.kg, 0, 'kg') },
          { etiqueta: 'Área que pide el lote', valor: num(r.Amax, 2), unidad: 'm²', nota: 'decide ' + NOM[r.decide] + '; ' + placasTxt(r.nReq) },
          { etiqueta: 'Carga de sus placas', valor: num(100 * r.carga, 0), unidad: '%', nota: placasTxt(r.s.placas) + ', al terminar el lote', alerta: r.carga > 1 }
        ];
      },
      veredicto: function (r) {
        if (r.carga > 1) return { alerta: true, html: 'Con ' + placasTxt(r.s.placas) + ' el agua las satura antes de terminar el lote y pasa con el aceite: hacen falta <b>' + r.nReq + '</b>.' };
        if (r.dp > r.s.dpAdm) return { alerta: true, html: 'La caída limpia, <b>' + un(r.dp * 1000, 0, 'mbar') + '</b>, pasa del límite de ' + un(r.s.dpAdm * 1000, 0, 'mbar') + ': hacen falta ' + r.nReq + ' placas.' };
        if (r.carga < 0.6 && r.nReq < r.s.placas) return { alerta: false, html: 'Las ' + r.s.placas + ' placas terminan el lote al ' + pct(r.carga) + ': sobra área, y con ' + placasTxt(r.nReq) + ' bastaría.' };
        return { alerta: false, html: (r.s.placas === 1 ? 'La placa termina' : 'Las ' + r.s.placas + ' placas terminan') + ' el lote al <b>' + pct(r.carga) + '</b>. Decide ' + NOM[r.decide] + ', y la caída limpia es de ' + mbar(r.dp) + '.' };
      },
      prediccion: {
        base: { grado: 'K 250' }, llevar: { grado: 'EKS' },
        pregunta: function (rb) { return 'Con la placa K 250 el lote pide ' + placasTxt(rb.nReq) + '. Si se cambia por la EKS, la más cerrada, ¿cuántas pide?'; },
        opciones: ['Más placas', 'Las mismas', 'Menos placas'],
        instruccion: 'Escoja el grado EKS y mire el número del centro.',
        cumple: function (st) { return st.grado === 'EKS'; },
        correcta: function (rn, rb) { return rn.nReq > rb.nReq ? 0 : rn.nReq < rb.nReq ? 2 : 1; },
        explica: function (rn, rb) {
          if (rn.nReq === rb.nReq) return 'La EKS frena más el aceite: pide ' + un(rn.A1, 2, 'm²') + ' para que la caída limpia no pase de ' + un(rn.s.dpAdm * 1000, 0, 'mbar') + ', contra ' + un(rb.A1, 3, 'm²') + ' de la K 250. Pero el agua pide ' + un(rn.A3, 2, 'm²') + ', y sigue decidiendo el área; con sus placas la caída limpia sube a ' + mbar(rn.dp) + '.';
          return 'La EKS pide ' + un(rn.A1, 2, 'm²') + ' para que la caída limpia no pase de ' + un(rn.s.dpAdm * 1000, 0, 'mbar') + ', más que los otros criterios: ahora decide la caída de presión, y hacen falta ' + placasTxt(rn.nReq) + '.';
        }
      },
      figuras: [prensa, criterios],
      calculo: function (r) {
        var J = M.PALL[r.s.grado];
        var nom = { caida: 'la caída de presión limpia', flujo: 'el flujo recomendado', agua: 'el agua que retiene la placa' }[r.decide];
        return {
          intro: 'Lo que no se purgó llega al filtro de placas. El cálculo suma esa agua y compara tres maneras de escoger el área; manda la que pide más.',
          pasos: [
            { titulo: 'El agua que llega al filtro',
              texto: 'Al filtro llegan el agua libre que no cayó en el reposo y toda el agua que salió de solución en el enfriado.',
              ec: 'w_{\\text{filtro}} = w_{\\text{libre,filtro}} + w_{\\text{sale}} \\qquad m_{\\text{agua}} = w_{\\text{filtro}}\\,m_{\\text{lote}}',
              num: 'w_{\\text{filtro}} = ' + kn(r.libreFiltro, 0) + ' + ' + kn(r.sale, 0) + ' = ' + kn(r.mgkg, 0) + '\\ \\mathrm{mg/kg} \\\\ m_{\\text{agua}} = ' + kn(r.mgkg, 0) + ' \\times ' + kn(r.kg, 1) + '/1000 = ' + kn(r.g, 1) + '\\ \\mathrm{g}' },
            { titulo: 'El caudal por el filtro',
              texto: 'La bomba pasa el lote por el filtro en el tiempo que fija el caso.',
              ec: 'Q = \\frac{V}{t_f}',
              num: 'Q = \\frac{' + kn(r.V, 4) + '}{' + kn(r.s.tf, 1) + ' \\times 3600} = ' + kc(r.Q, 2) + '\\ \\mathrm{m^3/s} = ' + kn(r.Q * 3.6e6, 1) + '\\ \\mathrm{L/h}' },
            { titulo: 'Primer criterio: la caída limpia',
              texto: 'Sin torta, la ecuación de la filtración deja solo la resistencia del medio. El fabricante da cuánta agua pasa por la placa limpia con 1 bar; de ahí sale la resistencia de la placa, y con la viscosidad del aceite frío, el área que deja pasar el caudal sin superar la caída admisible.',
              ec: 'Q = \\frac{A\\,\\Delta p}{\\mu\\,R_m} \\;\\Rightarrow\\; R_m = \\frac{\\Delta p_{\\text{ens}}}{\\mu_{\\text{agua}}\\,J_{\\text{agua}}} \\qquad A_1 = \\frac{\\mu\\,R_m\\,Q}{\\Delta p_{\\text{adm}}}',
              num: 'R_m = \\frac{10^5}{' + kc(M.MU_W20, 3) + ' \\times ' + kn(J, 0) + '/60\\,000} = ' + kc(r.Rm, 2) + '\\ \\mathrm{m^{-1}} \\\\ A_1 = \\frac{' + kc(r.o.mu, 3) + ' \\times ' + kc(r.Rm, 2) + ' \\times ' + kc(r.Q, 2) + '}{' + kc(r.s.dpAdm * 1e5, 1) + '} = ' + kn(r.A1, 3) + '\\ \\mathrm{m^2}',
              fuente: 'Agua que deja pasar cada placa Seitz K de Pall a 20 °C con 1 bar: 1700 L/(m²·min) la K 900, 510 la K 250, 146 la K 100 y 29 la EKS. La hoja de las placas ZD, de celulosa pura, no trae ese dato; el caso supone que la K 250 ZD deja pasar el agua como la K 250.', libro: ['filtracion.html#eq-fil-torta', 'Libro, ecuación 18.1'] },
            { titulo: 'Segundo criterio: el flujo recomendado',
              texto: 'Pall pide no pasar de 525 L/(m²·h) en sus grados finos ni de 850 en los de pulido. El explorador compara con el área mayor, la del grado fino, que es el lado seguro.',
              ec: 'A_2 = \\frac{Q}{J_{\\text{rec}}}',
              num: 'A_2 = \\frac{' + kn(r.Q * 3.6e6, 1) + '}{850} = ' + kn(r.A2[0], 3) + '\\ \\mathrm{m^2} \\qquad A_2 = \\frac{' + kn(r.Q * 3.6e6, 1) + '}{525} = ' + kn(r.A2[1], 3) + '\\ \\mathrm{m^2}',
              fuente: 'Hojas técnicas Seitz K y Seitz ZD de Pall, en las referencias del capítulo 18.' },
            { titulo: 'Tercer criterio: el agua que retiene la placa',
              texto: 'Cada metro cuadrado de placa guarda una cantidad de agua antes de empezar a soltarla con el aceite. El lote pide el área que alcanza para toda el agua que llega.',
              ec: 'A_3 = \\frac{m_{\\text{agua}}}{c_{\\text{ret}}} \\qquad n = \\left\\lceil \\frac{A_3}{A_{\\text{placa}}} \\right\\rceil',
              num: 'A_3 = \\frac{' + kn(r.g, 1) + '}{' + kn(r.s.cap, 0) + '} = ' + kn(r.A3, 3) + '\\ \\mathrm{m^2} \\qquad n = \\left\\lceil \\frac{' + kn(r.A3, 3) + '}{0{,}16} \\right\\rceil = ' + r.nAgua,
              fuente: 'Los ' + un(M.CASO.cap, 0, 'g/m²') + ' son una cifra ilustrativa del libro: ninguna hoja técnica la da.' },
            { titulo: 'Las placas que usted escogió',
              texto: 'El área que manda es la mayor de las tres; ahora la decide ' + nom + ', con ' + un(r.Amax, 3, 'm²') + ' y ' + placasTxt(r.nReq) + '. Con las placas que usted tiene en pantalla:',
              ec: 'A = n\\,A_{\\text{placa}} \\qquad \\text{carga} = \\frac{m_{\\text{agua}}}{c_{\\text{ret}}\\,A} \\qquad \\Delta p_{\\text{limpia}} = \\frac{\\mu\\,R_m\\,Q}{A}',
              num: 'A = ' + r.s.placas + ' \\times 0{,}16 = ' + kn(r.A, 2) + '\\ \\mathrm{m^2} \\\\ \\text{carga} = \\frac{' + kn(r.g, 1) + '}{' + kn(r.s.cap, 0) + ' \\times ' + kn(r.A, 2) + '} = ' + kn(r.carga, 2) + ' \\\\ \\Delta p_{\\text{limpia}} = \\frac{' + kc(r.o.mu, 3) + ' \\times ' + kc(r.Rm, 2) + ' \\times ' + kc(r.Q, 2) + '}{' + kn(r.A, 2) + '} \\\\ = ' + kn(r.dp * 1e5, 0) + '\\ \\mathrm{Pa} = ' + kn(r.dp * 1000, 1) + '\\ \\mathrm{mbar}',
              res: 'El agua puede no ser toda la carga de las placas: si una parte del residuo no volátil del aceite destilado precipita en frío, se suma. Con un residuo entre 0,08 y 1,4 %, el lote trae entre ' + un(r.residuo[0], 2, 'kg') + ' y ' + un(r.residuo[1], 1, 'kg') + ', y qué parte precipita se averigua enfriando una muestra y filtrándola.',
              libro: ['filtracion.html#fig-fil-aceite', 'Libro, figura 18.7'] }
          ],
          libro: [['filtracion.html#sec-fil-profundidad', 'Sección 18.7, El aceite frío'], ['filtracion.html#exm-fil-winter', 'Ejemplo 18.5, la winterización del aceite'], ['filtracion.html#fig-fil-aceite', 'Figura 18.7, el área de placa según el criterio'], ['filtracion.html#eq-fil-torta', 'Ecuación 18.1, la torta y la tela']]
        };
      }
    };
  })();

  /* ================= El explorador ================= */
  XL.explorador({
    id: 'filtracion',
    nombre: 'Explorador de filtración',
    capitulo: '18',
    curso: 'POU · 2027-10',
    modelo: { caso: M.CASO, calcular: M.calcular },
    libro: { capitulo: 'filtracion.html', pie: 'El modelo es el del capítulo 18 del libro.' },
    controles: CONTROLES,
    configuraciones: CONFIGURACIONES,
    partes: [
      { titulo: 'La winterización', escenas: [ENFRIADO, REPOSO, FILTRO] },
      { titulo: 'La torta', pronto: 'en la próxima entrega', escenas: ['La recta de Ruth', 'La torta compresible', 'La prensa del lodo', 'El tambor'] }
    ]
  });
})();
</script>
