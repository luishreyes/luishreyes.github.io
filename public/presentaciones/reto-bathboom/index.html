<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reto BathBoom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #051C2C; }
  #stage { position: fixed; inset: 0; }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; }

  #fs-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(5, 28, 44, 0.85);
    backdrop-filter: blur(6px);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    font: 500 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    transition: background 150ms ease, transform 150ms ease;
  }
  #fs-btn:hover { background: rgba(0, 169, 244, 0.85); transform: translateY(-1px); }
  #fs-btn svg { width: 16px; height: 16px; display: block; }

  @media print {
    #fs-btn { display: none !important; }
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="deck" src="bundle.html" title="Reto BathBoom" allowfullscreen></iframe>
</div>

<button id="fs-btn" type="button" aria-label="Pantalla completa">
  <svg class="icon-enter" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2H2v4M14 6V2h-4M6 14H2v-4M10 14h4v-4"/></svg>
  <svg class="icon-exit" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M2 5h3V2M14 5h-3V2M2 11h3v3M14 11h-3v3"/></svg>
  <span class="label">Pantalla completa</span>
</button>

<script>
  // El carrusel de miniaturas y la barra de navegación viven dentro del
  // componente <deck-stage> del iframe, y ese componente solo se esconde
  // a sí mismo cuando ÉL es el elemento en fullscreen (compara
  // document.fullscreenElement === this, dentro de SU PROPIO documento).
  // Poner en fullscreen el <iframe> o el wrapper no dispara esa lógica —
  // hay que apuntar el fullscreen directo al <deck-stage> interno.
  var iframe = document.getElementById('deck');
  var btn = document.getElementById('fs-btn');
  var iconEnter = btn.querySelector('.icon-enter');
  var iconExit = btn.querySelector('.icon-exit');
  var label = btn.querySelector('.label');

  function getDeckDoc() {
    try { return iframe.contentDocument || iframe.contentWindow.document; } catch (e) { return null; }
  }
  function getDeckEl() {
    var doc = getDeckDoc();
    return doc ? doc.querySelector('deck-stage') : null;
  }
  function isFullscreen() {
    var doc = getDeckDoc();
    return !!(doc && (doc.fullscreenElement || doc.webkitFullscreenElement));
  }

  btn.addEventListener('click', function () {
    var doc = getDeckDoc();
    if (!doc) return;
    if (isFullscreen()) {
      var exit = doc.exitFullscreen || doc.webkitExitFullscreen;
      if (exit) exit.call(doc);
    } else {
      var el = getDeckEl();
      if (!el) return;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        var p = req.call(el);
        if (p && p.catch) p.catch(function () {});
      }
    }
  });

  function onFsChange() {
    var on = isFullscreen();
    iconEnter.style.display = on ? 'none' : '';
    iconExit.style.display = on ? '' : 'none';
    label.textContent = on ? 'Salir de pantalla completa' : 'Pantalla completa';

    // El deck-stage empaquetado en este bundle no tiene su propio manejo de
    // fullscreen (versión previa a esa función), así que el carrusel de
    // miniaturas se esconde a mano con su atributo no-rail — soportado
    // nativamente por el componente (ver observedAttributes / _railWidth).
    var el = getDeckEl();
    if (el) {
      if (on) el.setAttribute('no-rail', '');
      else el.removeAttribute('no-rail');
    }
  }

  function attachFsListener() {
    var doc = getDeckDoc();
    if (!doc) { setTimeout(attachFsListener, 300); return; }
    doc.addEventListener('fullscreenchange', onFsChange);
    doc.addEventListener('webkitfullscreenchange', onFsChange);
  }
  iframe.addEventListener('load', attachFsListener);
  attachFsListener();
</script>

</body>
</html>
