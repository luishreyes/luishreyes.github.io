<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reto BathBoom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #051C2C; }
  #stage { position: fixed; inset: 0; }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; }

  #fs-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(5, 28, 44, 0.85);
    backdrop-filter: blur(6px);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    font: 500 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    transition: background 150ms ease, transform 150ms ease;
  }
  #fs-btn:hover { background: rgba(0, 169, 244, 0.85); transform: translateY(-1px); }
  #fs-btn svg { width: 16px; height: 16px; display: block; }

  @media print {
    #fs-btn { display: none !important; }
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="deck" src="bundle.html" title="Reto BathBoom" allowfullscreen></iframe>
</div>

<button id="fs-btn" type="button" aria-label="Pantalla completa">
  <svg class="icon-enter" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2H2v4M14 6V2h-4M6 14H2v-4M10 14h4v-4"/></svg>
  <svg class="icon-exit" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M2 5h3V2M14 5h-3V2M2 11h3v3M14 11h-3v3"/></svg>
  <span class="label">Pantalla completa</span>
</button>

<script>
  var stage = document.getElementById('stage');
  var btn = document.getElementById('fs-btn');
  var iconEnter = btn.querySelector('.icon-enter');
  var iconExit = btn.querySelector('.icon-exit');
  var label = btn.querySelector('.label');

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  btn.addEventListener('click', function () {
    if (isFullscreen()) {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    } else {
      var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
      if (req) {
        var p = req.call(stage);
        if (p && p.catch) p.catch(function () {});
      }
    }
  });

  function onFsChange() {
    var on = isFullscreen();
    iconEnter.style.display = on ? 'none' : '';
    iconExit.style.display = on ? '' : 'none';
    label.textContent = on ? 'Salir de pantalla completa' : 'Pantalla completa';
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
</script>

</body>
</html>
